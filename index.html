              />
            </Question>

            <Question icon={<WalletIcon/>} number="2" text="Qual'è la disponibilità attuale per realizzare le fondamenta di questo obiettivo?">
              <CurrencyInput value={obiettivo.disponibilitaAttuale} onChange={(v)=>updateObiettivo({disponibilitaAttuale:v})}/>
            </Question>

            {obiettivo.disponibilitaAttuale !== "" && (
              <Question className="reveal" icon={<WalletIcon/>} number="2.1" text={currencyDigitsToNumber(obiettivo.disponibilitaAttuale) === 0
                  ? "Quale importo mensile vuole destinare alla realizzazione di questo obiettivo:"
                  : "Per raggiungere serenamente l'obiettivo quanto è disposto ad accumulare mensilmente?"}>
                <CurrencyInput value={obiettivo.integrazioneMensile} onChange={(v)=>updateObiettivo({integrazioneMensile:v})}/>
              </Question>
            )}

            <Question icon={<StarIcon/>} number="3" text="Quanto è importante raggiungere questo obiettivo per te?">
              <ScaleQuestion value={obiettivo.importanzaObiettivo} onChange={(v)=>updateObiettivo({importanzaObiettivo:v})}/>
            </Question>

            <Question icon={<TrophyIcon/>} number="4" text="Quale frase descrive meglio ciò che vuole ottenere da questo investimento?">
              <ChoiceQuestion
                options={["Arrivare al risultato con certezza","Arrivare al risultato con buona probabilità","Arrivare più in alto possibile, fiducioso del mercato"]}
                value={obiettivo.risultatoAtteso}
                onChange={(v)=>updateObiettivo({risultatoAtteso:v})}
              />
            </Question>

            <div style={{flex:1}}/>
            <PromiseBox icon={<PersonIcon/>} text={obiettivoSummary()}/>
          </div>
        </div>

        <div className="arrow-wrap"><ArrowSvg/></div>

        {/* ---------------- TEMPO (cambia ad ogni progetto) ---------------- */}
        <div className="card dark">
          <div className="circle">2</div>
          <div className="card-header dark">
            <h2>TEMPO</h2>
          </div>
          <div className="card-body">
            <Question icon={<HourglassIcon/>} number="1" text="Tra quanti anni vorresti vedere il tuo progetto realizzarsi?">
              <TimeSlider
                idx={tempo.orizzonteIdx}
                touched={tempo.orizzonteTouched}
                onChange={(v)=>updateTempo({orizzonteIdx:v, orizzonteTouched:true})}
              />
            </Question>
            <Question icon={<WalletIcon/>} number="2" text="Se si verificasse un imprevisto personale, quanto sarebbe importante poter accedere al capitale investito?">
              <ChoiceQuestion
                options={["Importante, per ogni imprevisto","Necessario, solo in caso di Salute","Trascurabile, ho un cuscinetto separato"]}
                value={tempo.accessoImprevisto}
                onChange={(v)=>updateTempo({accessoImprevisto:v})}
              />
            </Question>
            <Question icon={<PieIcon/>} number="3" text="Ci sono stati episodi in passato che hanno influenzato la gestione dei tuoi investimenti?">
              <LineInput value={tempo.esperienze} onChange={(v)=>updateTempo({esperienze:v})}/>
            </Question>
            <Question icon={<ShieldPctIcon/>} number="4" text="Se per raggiungere il mio obiettivo servisse maggior tempo:">
              <ChoiceQuestion
                options={["Liquiderei, non potendo attendere","Potrei rinviare di 1-2 anni","Potrei rinviare per oltre 3 anni"]}
                value={tempo.maggiorTempo}
                onChange={(v)=>updateTempo({maggiorTempo:v})}
              />
            </Question>
            <div style={{flex:1}}/>
            <PromiseBox icon={<CalendarIcon/>} text={tempoSummary()}/>
          </div>
        </div>

        <div className="arrow-wrap"><ArrowSvg/></div>

        {/* ---------------- CAPACITÀ (condivisa fra tutti i progetti) ---------------- */}
        <div className="card" style={{position:"relative"}}>
          <div className="circle">3</div>
          <div className="card-header red">
            <h2>CAPACITÀ</h2>
          </div>
          <div className="card-body">
            <Question icon={<PieIcon/>} number="1" text="Quanto rappresenta questo investimento sul totale del tuo patrimonio?">
              <ChoiceQuestion
                options={["Meno del 25%","Tra il 25% e il 50%","Tra il 50% e il 75%","Oltre il 75%"]}
                value={capacita.quotaPatrimonio}
                onChange={(v)=>updateCapacita({quotaPatrimonio:v})}
              />
            </Question>
            <Question icon={<WalletIcon/>} number="2" text="Che parte del suo reddito mensile netto è già impegnata in rate, mutuo, affitto o altri impegni fissi?">
              <ChoiceQuestion
                options={["10% - 20%","20% - 35%","35% - 50%","Oltre il 50%"]}
                value={capacita.redditoImpegnato}
                onChange={(v)=>updateCapacita({redditoImpegnato:v})}
              />
            </Question>
            <Question icon={<ShieldPctIcon/>} number="3" text="Se le sue spese aumentassero del 20%, come cambierebbe la sua situazione?">
              <ChoiceQuestion
                options={["Non cambierebbe molto","Dovrei fare delle rinunce","Dovrei tagliare spese importanti","Andrei in difficoltà"]}
                value={capacita.spesaPiu20}
                onChange={(v)=>updateCapacita({spesaPiu20:v})}
              />
            </Question>
            <Question icon={<TargetIcon/>} number="4" text="Quant'è importante per te mantenere una liquidità sul conto?">
              <div className="option-grid">
                <div className="inline-currency-option">
                  <label
                    className={"option" + (capacita.liquiditaImportanza==="Assolutamente" ? " selected" : "")}
                    onClick={()=>updateCapacita({liquiditaImportanza: capacita.liquiditaImportanza==="Assolutamente" ? null : "Assolutamente"})}
                  >
                    <span className="checkbox"><CheckIcon/></span>
                    Assolutamente, almeno
                  </label>
                  {capacita.liquiditaImportanza==="Assolutamente" && (
                    <CurrencyInput value={capacita.liquiditaImportoAssoluto} onChange={(v)=>updateCapacita({liquiditaImportoAssoluto:v})}/>
                  )}
                </div>
                <div className="inline-currency-option">
                  <label
                    className={"option" + (capacita.liquiditaImportanza==="Relativo" ? " selected" : "")}
                    onClick={()=>updateCapacita({liquiditaImportanza: capacita.liquiditaImportanza==="Relativo" ? null : "Relativo"})}
                  >
                    <span className="checkbox"><CheckIcon/></span>
                    Relativo, almeno
                  </label>
                  {capacita.liquiditaImportanza==="Relativo" && (
                    <CurrencyInput value={capacita.liquiditaImportoRelativo} onChange={(v)=>updateCapacita({liquiditaImportoRelativo:v})}/>
                  )}
                </div>
                <label
                  className={"option" + (capacita.liquiditaImportanza==="Non necessario" ? " selected" : "")}
                  onClick={()=>updateCapacita({liquiditaImportanza: capacita.liquiditaImportanza==="Non necessario" ? null : "Non necessario"})}
                >
                  <span className="checkbox"><CheckIcon/></span>
                  Non necessario
                </label>
              </div>
            </Question>
            <div style={{flex:1}}/>
            <PromiseBox icon={<ShieldHeartIcon/>} text={capacitaSummary()}/>
          </div>
        </div>

        {opportunita.revealed ? (
          <div className="arrow-wrap"><ArrowSvg/></div>
        ) : (
          <div className="opportunita-adder no-print">
            <button type="button" className="opportunita-plus" onClick={revealOpportunita} title="Aggiungi scheda Opportunità">+</button>
          </div>
        )}

        {/* ---------------- OPPORTUNITÀ (condivisa fra tutti i progetti) ---------------- */}
        {opportunita.revealed && (
          <div className="card dark">
            <div className="circle">4</div>
            <div className="card-header dark">
              <h2>OPPORTUNITÀ</h2>
              <button
                type="button"
                className="card-header-delete no-print"
                onClick={removeOpportunita}
                title="Elimina scheda Opportunità"
              >×</button>
            </div>
            <div className="card-body">
              <Question icon={<SmileyIcon/>} number="1" text="Cosa cerchi prima di tutto in un investimento?">
                <ChoiceQuestion
                  options={["Tranquillità (capitale stabile)","Efficienza (battere l'inflazione)","Crescita (massimo rendimento)"]}
                  value={opportunita.primaCosa}
                  onChange={(v)=>updateOpportunita({primaCosa:v})}
                />
              </Question>
              <Question icon={<TrendIcon/>} number="2" text="Quanto si sente a suo agio con la variabilità dei mercati?">
                <ScaleQuestion value={opportunita.comfort} onChange={(v)=>updateOpportunita({comfort:v})}/>
              </Question>
              <Question icon={<ShieldPctIcon/>} number="3" text="Se il mercato scendesse temporaneamente del 10% cosa faresti?">
                <ChoiceQuestion
                  options={["Riscatto l'intero importo","Provo a non pensarci sperando che il mercato risalga","Attendo con serenità","Approfitto del momento con un nuovo versamento"]}
                  value={opportunita.azioneCalo}
                  onChange={(v)=>updateOpportunita({azioneCalo:v})}
                />
              </Question>
              <Question icon={<PieIcon/>} number="4" text="Quali di questi strumenti ha detenuto negli ultimi 10 anni?">
                <ChoiceQuestion
                  options={["Conto, deposito","Gestione separata, BTP, Obbligazioni","Polizze unit-linked, Fondi bilanciati","Azioni, ETF","Strumenti complessi, criptovalute"]}
                  value={opportunita.strumenti}
                  onChange={(v)=>updateOpportunita({strumenti:v})}
                />
              </Question>
              {STRUMENTI_RISCHIOSI.includes(opportunita.strumenti) && (
                <Question className="reveal" icon={<ShieldPctIcon/>} number="4.1" text="Cosa hai fatto realmente nei forti cali di mercato del 2020 o del 2022?">
                  <ChoiceQuestion
                    options={["Ho venduto tutto o quasi","Ho venduto una parte","Ho mantenuto la posizione","Ho investito di più approfittando dei prezzi bassi"]}
                    value={opportunita.crolloReale}
                    onChange={(v)=>updateOpportunita({crolloReale:v})}
                  />
                </Question>
              )}
              <div style={{flex:1}}/>
              <PromiseBox icon={<TrendIcon/>} text={opportunitaSummary()}/>
            </div>
          </div>
        )}

      </div>
      </div>

      <div className="print-only print-schede">
        {progetti.map(p => {
          return (
          <div className="print-progetto" key={p.id}>
            <h2 className="print-progetto-title">{p.nome}</h2>
            <table className="print-table">
              <tbody>
                <tr className="print-section-row"><td colSpan="2">OBIETTIVO</td></tr>
                <tr>
                  <td>1. Quanto capitale immagini possa servire per realizzare il tuo obiettivo?</td>
                  <td>{p.obiettivo.capitaleObiettivo ? `€ ${formatCurrencyDigits(p.obiettivo.capitaleObiettivo)}` : "—"}</td>
                </tr>
                <tr>
                  <td>2. Qual'è la disponibilità attuale per realizzare le fondamenta di questo obiettivo?</td>
                  <td>{p.obiettivo.disponibilitaAttuale ? `€ ${formatCurrencyDigits(p.obiettivo.disponibilitaAttuale)}` : "—"}</td>
                </tr>
                <tr>
                  <td>2.1. Versamento/accumulo mensile per l'obiettivo</td>
                  <td>{p.obiettivo.integrazioneMensile ? `€ ${formatCurrencyDigits(p.obiettivo.integrazioneMensile)}` : "—"}</td>
                </tr>
                <tr>
                  <td>3. Quanto è importante raggiungere questo obiettivo per te?</td>
                  <td>{p.obiettivo.importanzaObiettivo!=null ? `${p.obiettivo.importanzaObiettivo}/10` : "—"}</td>
                </tr>
                <tr>
                  <td>4. Cosa vuole ottenere da questo investimento?</td>
                  <td>{p.obiettivo.risultatoAtteso || "—"}</td>
                </tr>

                <tr className="print-section-row"><td colSpan="2">TEMPO</td></tr>
                <tr>
                  <td>1. Tra quanti anni vorresti vedere il tuo progetto realizzarsi?</td>
                  <td>{p.tempo.orizzonteTouched ? TIME_RANGES[p.tempo.orizzonteIdx] : "—"}</td>
                </tr>
                <tr>
                  <td>2. Se si verificasse un imprevisto personale, quanto sarebbe importante poter accedere al capitale investito?</td>
                  <td>{p.tempo.accessoImprevisto || "—"}</td>
                </tr>
                <tr>
                  <td>3. Ci sono stati episodi in passato che hanno influenzato la gestione dei tuoi investimenti?</td>
                  <td>{p.tempo.esperienze || "—"}</td>
                </tr>
                <tr>
                  <td>4. Se servisse maggior tempo per raggiungere l'obiettivo</td>
                  <td>{p.tempo.maggiorTempo || "—"}</td>
                </tr>

                <tr className="print-section-row"><td colSpan="2">CAPACITÀ</td></tr>
                <tr>
                  <td>1. Quanto rappresenta questo investimento sul totale del tuo patrimonio?</td>
                  <td>{capacita.quotaPatrimonio || "—"}</td>
                </tr>
                <tr>
                  <td>2. Quota di reddito mensile netto già impegnata in rate/mutuo/affitto</td>
                  <td>{capacita.redditoImpegnato || "—"}</td>
                </tr>
                <tr>
                  <td>3. Se le spese aumentassero del 20%</td>
                  <td>{capacita.spesaPiu20 || "—"}</td>
                </tr>
                <tr>
                  <td>4. Importanza di mantenere liquidità sul conto</td>
                  <td>
                    {capacita.liquiditaImportanza || "—"}
                    {capacita.liquiditaImportanza==="Assolutamente" && capacita.liquiditaImportoAssoluto ? ` (€ ${formatCurrencyDigits(capacita.liquiditaImportoAssoluto)})` : ""}
                    {capacita.liquiditaImportanza==="Relativo" && capacita.liquiditaImportoRelativo ? ` (€ ${formatCurrencyDigits(capacita.liquiditaImportoRelativo)})` : ""}
                  </td>
                </tr>

                {opportunita.revealed && (
                  <React.Fragment>
                    <tr className="print-section-row"><td colSpan="2">OPPORTUNITÀ (TOLLERANZA)</td></tr>
                    <tr>
                      <td>1. Cosa cerchi prima di tutto in un investimento?</td>
                      <td>{opportunita.primaCosa || "—"}</td>
                    </tr>
                    <tr>
                      <td>2. A suo agio con la variabilità dei mercati</td>
                      <td>{opportunita.comfort!=null ? `${opportunita.comfort}/10` : "—"}</td>
                    </tr>
                    <tr>
                      <td>3. Se il mercato scendesse temporaneamente del 10%</td>
                      <td>{opportunita.azioneCalo || "—"}</td>
                    </tr>
                    <tr>
                      <td>4. Strumenti detenuti negli ultimi 10 anni</td>
                      <td>{opportunita.strumenti || "—"}</td>
                    </tr>
                    {STRUMENTI_RISCHIOSI.includes(opportunita.strumenti) && (
                      <tr>
                        <td>4.1. Reazione reale ai crolli 2020/2022</td>
                        <td>{opportunita.crolloReale || "—"}</td>
                      </tr>
                    )}
                  </React.Fragment>
                )}
              </tbody>
            </table>
          </div>
          );
        })}
      </div>

      <div className="priority-banner">
        <div className="pb-header">
          <div className="pb-side pb-side-ghost"></div>
          <div className="pb-header-text">
            <p className="pb-title">Progetto Strategia Generali</p>
            <p className="pb-subtitle">Quanto è disposto a destinare oggi a questo progetto?</p>
          </div>
        </div>
        <div className="pb-body">
          <div className="pb-side"><span>Priorità</span></div>
          <div className="pb-content">
            <div className="priority-list">
              {progettiOrdinati.map(p => (
                <div className="priority-row" key={p.id}>
                  <span className="priority-badge">{p.nome}</span>
                  {(p.importi && p.importi.length ? p.importi : [""]).map((val, idx) => (
                    <div className="priority-importo-wrap" key={idx}>
                      <input
                        type="text"
                        className="priority-importo-input"
                        placeholder="Importo"
                        value={val}
                        onChange={(e)=>updateImporto(p.id, idx, e.target.value)}
                      />
                      <span className={"priority-importo-static" + (val ? "" : " is-placeholder")}>
                        {val || "Importo"}
                      </span>
                      <button
                        type="button"
                        className="priority-importo-x no-print"
                        onClick={()=>deleteImporto(p.id, idx)}
                        title="Rimuovi questo importo"
                      >×</button>
                    </div>
                  ))}
                  <button
                    type="button"
                    className="priority-add-importo no-print"
                    onClick={()=>addImporto(p.id)}
                    title="Aggiungi un altro importo"
                  >+</button>
                </div>
              ))}
            </div>
          </div>
          <div className="pb-tagline"><p>&ldquo;Diamo VALORE ai tuo OBIETTIVI.&rdquo;</p></div>
        </div>
      </div>

      <div className="promise-bar">
        <div className="promise-item">
          <div className="pi-icon"><PersonIcon/></div>
          <div>
            <h3>LA NOSTRA PROMESSA</h3>
            <p>Ti affianchiamo con competenza, trasparenza e ascolto per aiutarti a prendere decisioni consapevoli.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><PeopleIcon/></div>
          <div>
            <h3>ASCOLTO</h3>
            <p>Capiamo le tue esigenze per conoscerti veramente.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><SearchIcon/></div>
          <div>
            <h3>ANALISI</h3>
            <p>Valutiamo insieme tutte le variabili che contano.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><CompassIcon/></div>
          <div>
            <h3>PIANIFICAZIONE</h3>
            <p>Costruiamo un piano su misura per i tuoi obiettivi.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><ChartUpIcon/></div>
          <div>
            <h3>MONITORAGGIO</h3>
            <p>Ti accompagniamo nel tempo, adattando la strategia con te.</p>
          </div>
        </div>

        <div className="quote">
          <span className="mark">&ldquo;</span>
          <span>Il miglior investimento è quello che ti porta verso il <strong>futuro che desideri</strong>.</span>
          <span className="mark">&rdquo;</span>
        </div>
      </div>

      <div className="toolbar no-print">
        <button className="tb-btn" onClick={handlePrint} disabled={pdfBusy}>
          <PrintIcon/> {pdfBusy ? "Generazione PDF…" : "Stampa / Export PDF"}
        </button>
        <button className="tb-btn" onClick={handleImportClick}><UploadIcon/> Importa Progetto</button>
        <button className="tb-btn primary" onClick={handleExport}><DownloadIcon/> Esporta Progetto</button>
      </div>
      {importMsg && <p className={"import-msg no-print " + importMsg.type}>{importMsg.text}</p>}

      <ClienteModal
        open={clienteModalOpen}
        onClose={()=>setClienteModalOpen(false)}
        cliente={cliente}
        updateCliente={updateCliente}
        familiari={familiari}
        addFamiliare={addFamiliare}
        updateFamiliare={updateFamiliare}
        removeFamiliare={removeFamiliare}
      />

      <ProfiloModal
        open={profiloModalOpen}
        onClose={()=>setProfiloModalOpen(false)}
        progetti={progetti}
        activeProgettoId={activeProgettoId}
        capacita={capacita}
        opportunita={opportunita}
      />

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
