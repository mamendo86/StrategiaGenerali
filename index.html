/* =========================================================================
   Import / Export — architettura estensibile e compatibile iOS/iPadOS
   ========================================================================= */

// Costruisce il payload JSON esportabile (usato sia dal download diretto
// sia dalla finestra "Salva con nome" via File System Access API).
const buildExportPayload = (fullAppState) => JSON.stringify({
  version: "1.0",
  timestamp: new Date().toISOString(),
  data: fullAppState
}, null, 2);

// Esporta l'INTERO albero di stato dell'app (schede attuali + future),
// avvolto in un contenitore con metadati. Usa URL.createObjectURL per
// bypassare i blocchi di sicurezza delle webview locali su iPad.
const exportProjectData = (fullAppState, filename = "strategia_generali_progetto.json") => {
  try {
    const jsonString = buildExportPayload(fullAppState);
    const blob = new Blob([jsonString], {type: "application/json;charset=utf-8;"});
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.setAttribute("download", filename);
    link.style.display = "none";

    document.body.appendChild(link);
    link.click();

    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }, 100);
    return true;
  } catch (error) {
    console.error("Errore durante l'esportazione:", error);
    alert("Impossibile esportare il file. Assicurati che l'applicazione supporti il salvataggio dei file.");
    return false;
  }
};

// Importa con merge intelligente: il file sovrascrive i dati esistenti ma
// mantiene i valori di default per eventuali schede future non presenti
// nei vecchi salvataggi.
const triggerImport = (setAppState, defaultInitialState, onDone) => {
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = ".json,application/json";
  fileInput.style.display = "none";

  fileInput.onchange = (event) => {
    const file = event.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsedFile = JSON.parse(e.target.result);
        const importedData = parsedFile.data || parsedFile;

        // Retrocompatibilità: i vecchi file avevano un solo progetto
        // (chiavi obiettivo/tempo/rischio dirette sulla radice) invece
        // dell'array "progetti", e la scheda "Capacità" (allora "rischio")
        // viveva dentro ogni progetto invece che condivisa. Li convertiamo
        // al volo, recuperando dal primo progetto trovato un valore di
        // partenza per la Capacità/Opportunità condivisa se non presenti
        // già a livello di radice.
        let progettiImportati;
        let rischioLegacy = null;
        if(Array.isArray(importedData.progetti) && importedData.progetti.length>0){
          progettiImportati = importedData.progetti.map((p, i) => {
            if(!rischioLegacy && p.rischio) rischioLegacy = p.rischio;
            return {
              id: p.id || ("progetto-" + (i+1)),
              nome: p.nome || ("Obiettivo " + (i+1)),
              obiettivo: {...DEFAULT_OBIETTIVO(), ...migraRisultato(p.obiettivo||{})},
              tempo: {...DEFAULT_TEMPO(), ...(p.tempo||{})},
              ...migratePremi(p),
              ...(p.portafoglio && Array.isArray(p.portafoglio.voci) ? {portafoglio: p.portafoglio} : {})
            };
          });
        } else if(importedData.obiettivo || importedData.tempo || importedData.rischio){
          rischioLegacy = importedData.rischio || null;
          progettiImportati = [{
            id: "progetto-1",
            nome: "Obiettivo",
            obiettivo: {...DEFAULT_OBIETTIVO(), ...migraRisultato(importedData.obiettivo||{})},
            tempo: {...DEFAULT_TEMPO(), ...(importedData.tempo||{})},
            ...migratePremi(importedData)
          }];
        } else {
          progettiImportati = defaultInitialState.progetti;
        }
        progettiImportati = progettiImportati.map(fillPremiFromObiettivo);

        const capacitaImportata = importedData.capacita
          ? {...DEFAULT_CAPACITA(), ...importedData.capacita}
          : (rischioLegacy
              ? {...DEFAULT_CAPACITA(), quotaPatrimonio: rischioLegacy.quotaPatrimonio || null}
              : defaultInitialState.capacita);
        const opportunitaImportata = importedData.opportunita
          ? {...DEFAULT_OPPORTUNITA(), ...importedData.opportunita, strumenti: asStrumentiList(importedData.opportunita.strumenti), strumentiDurata: (importedData.opportunita.strumentiDurata && typeof importedData.opportunita.strumentiDurata === "object") ? importedData.opportunita.strumentiDurata : {}}
          : (rischioLegacy && rischioLegacy.azioneCalo
              ? {...DEFAULT_OPPORTUNITA(), revealed:true, azioneCalo: rischioLegacy.azioneCalo}
              : defaultInitialState.opportunita);

        setAppState(prevState => ({
          ...defaultInitialState,
          ...importedData,
          progettiVita: typeof importedData.progettiVita === "string" ? importedData.progettiVita : defaultInitialState.progettiVita,
          progetti: progettiImportati,
          activeProgettoId: progettiImportati[0].id,
          capacita: capacitaImportata,
          opportunita: opportunitaImportata,
          cliente: {...defaultInitialState.cliente, ...(importedData.cliente||{})},
          familiari: Array.isArray(importedData.familiari) ? importedData.familiari : defaultInitialState.familiari
        }));

        if(onDone) onDone({type:"ok", text:"Progetto ripristinato con successo!"});
      } catch (err) {
        if(onDone) onDone({type:"error", text:"Errore nel caricamento: il file non è un file di progetto valido."});
      }
    };
    reader.readAsText(file);
  };

  document.body.appendChild(fileInput);
  fileInput.click();
  document.body.removeChild(fileInput);
};

/* ---------------- Tab Progetto (nome modificabile tramite icona matita —
   più affidabile del doppio clic su dispositivi touch come iPad) ---------------- */
function ProgettoTab({progetto, active, canDelete, onSelect, onRename, onDelete}){
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(progetto.nome);
  const inputRef = useRef(null);

  useEffect(()=>{ setDraft(progetto.nome); }, [progetto.nome]);
  useEffect(()=>{
    if(editing && inputRef.current){ inputRef.current.focus(); inputRef.current.select(); }
  }, [editing]);

  const commit = () => {
    setEditing(false);
    onRename(draft.trim() || progetto.nome || "Obiettivo");
  };

  const handleDelete = () => {
    if(!canDelete) return;
    const ok = window.confirm(`Eliminare la scheda "${progetto.nome}"? I dati inseriti andranno persi.`);
    if(ok) onDelete();
  };

  if(editing){
    return (
      <div className="progetto-tab-editing">
        <input
          ref={inputRef}
          className="progetto-tab-input"
          value={draft}
          onChange={(e)=>setDraft(e.target.value)}
          onBlur={commit}
          onKeyDown={(e)=>{
            if(e.key==="Enter"){ e.preventDefault(); commit(); }
            if(e.key==="Escape"){ setDraft(progetto.nome); setEditing(false); }
          }}
        />
        {canDelete && (
          <button
            type="button"
            className="progetto-tab-delete"
            onMouseDown={(e)=>e.preventDefault()}
            onClick={handleDelete}
            title="Elimina questa scheda progetto"
          >×</button>
        )}
      </div>
    );
  }

  return (
    <div
      className={"progetto-tab" + (active ? " active" : "")}
      onClick={onSelect}
      role="button"
      tabIndex={0}
    >
      <span className="progetto-tab-label">{progetto.nome}</span>
      <button
        type="button"
        className="progetto-tab-edit"
        onClick={(e)=>{ e.stopPropagation(); setEditing(true); }}
        title="Rinomina progetto"
      >
        <EditIcon/>
      </button>
    </div>
  );
}

/* =========================================================================
   Generazione PDF lato client — stessa identica grafica della stampa
   (vedi .pdf-capture nel CSS), ma prodotta con html2canvas + jsPDF invece
   di window.print(): funziona su qualsiasi dispositivo, incluse le app
   installate su iPad/iPhone (modalità standalone), dove window.print()
   è un limite noto di WebKit e non apre mai la stampa.
   ========================================================================= */
async function buildPdfBlobFromElement(el){
  const canvas = await window.html2canvas(el, {
    scale: 2,
    backgroundColor: "#F4F2EE",
    useCORS: true,
    windowWidth: el.scrollWidth,
    windowHeight: el.scrollHeight
  });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "pt", format: "a4" });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const margin = 20;
  const usableWidth = pageWidth - margin * 2;
  const usableHeight = pageHeight - margin * 2;
  const ptPerPx = usableWidth / canvas.width;
  const pageHeightPx = usableHeight / ptPerPx;

  let renderedPx = 0;
  let first = true;
  while (renderedPx < canvas.height) {
    const sliceHeightPx = Math.min(pageHeightPx, canvas.height - renderedPx);
    const sliceCanvas = document.createElement("canvas");
    sliceCanvas.width = canvas.width;
    sliceCanvas.height = sliceHeightPx;
    const ctx = sliceCanvas.getContext("2d");
    ctx.drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
    const imgData = sliceCanvas.toDataURL("image/jpeg", 0.92);
    if (!first) pdf.addPage();
    pdf.addImage(imgData, "JPEG", margin, margin, usableWidth, sliceHeightPx * ptPerPx);
    renderedPx += sliceHeightPx;
    first = false;
  }
  return pdf.output("blob");
}

/* ---------------- Strategia portafoglio ----------------
   Per ogni obiettivo: grafico a torta con la composizione proposta in base al
   rendimento che serve per raggiungerlo (fino al 4% = impostazione prudente,
   oltre il 4% = impostazione orientata alla crescita). La proposta è solo un
   punto di partenza: prodotti e percentuali si possono modificare liberamente.
   Le attribuzioni ai due scenari sono un'ipotesi di lavoro (vedi PORTAFOGLIO_PROPOSTE). */
const PORTAFOGLIO_PRODOTTI = [
  { nome:"Rinnova Valore Bonus",             colore:"#C8102E" },
  { nome:"Rinnova Valore Bonus Royal Fund",  colore:"#BFC3C8" },
  { nome:"Generazione Risparmio",            colore:"#3A3A3A" },
  { nome:"Generazione Investimento",         colore:"#8E0B20" },
  { nome:"Generazione Sviluppo Sostenibile", colore:"#7D838A" }
];
const PORTAFOGLIO_SOGLIA = 0.04;
const PORTAFOGLIO_PROPOSTE = {
  prudente: [["Rinnova Valore Bonus",40],["Rinnova Valore Bonus Royal Fund",25],["Generazione Risparmio",25],["Generazione Investimento",10]],
  crescita: [["Rinnova Valore Bonus",10],["Rinnova Valore Bonus Royal Fund",15],["Generazione Risparmio",15],["Generazione Investimento",35],["Generazione Sviluppo Sostenibile",25]]
};
const PORTAFOGLIO_COLORI_EXTRA = ["#E8586C","#5B6168","#F3A6B0","#9AA0A6","#1F1F1F","#5A0F1D","#D9D9DC","#A31C34"];
const PORT_APERTI = new Set();
const nomeVoce = (v) => (v.prodotto && v.prodotto.trim()) ? v.prodotto : "Nuovo prodotto";
const coloreVoce = (v) => v.colore || coloreProdotto(v.prodotto);
const coloreProdotto = (nome) => (PORTAFOGLIO_PRODOTTI.find(x => x.nome === nome) || {colore:"#8F8A7D"}).colore;
const fmtPerc1 = (r) => (r * 100).toFixed(1).replace(".", ",") + "%";

function propostaPortafoglio(progetto, capacita, opportunita){
  const f = computeFeasibility(progetto);
  let tipo, motivo;
  if(f.ok && (f.status === "raggiunto" || f.status === "calcolato")){
    if(f.required <= PORTAFOGLIO_SOGLIA){
      tipo = "prudente";
      motivo = f.status === "raggiunto"
        ? "con le risorse indicate l'obiettivo è raggiungibile anche senza rendimento"
        : "per arrivare all'obiettivo serve un rendimento di circa " + fmtPerc1(f.required) + " l'anno, fino al 4%";
    } else {
      tipo = "crescita";
      motivo = "per arrivare all'obiettivo serve un rendimento di circa " + fmtPerc1(f.required) + " l'anno, oltre il 4%";
    }
  } else if(f.ok){
    tipo = "crescita";
    motivo = "l'obiettivo richiederebbe un rendimento molto elevato: conviene valutarlo insieme";
  } else {
    const lv = computeGoalProfile(progetto, capacita, opportunita).level;
    tipo = lv != null && lv >= 3 ? "crescita" : "prudente";
    motivo = "dati dell'obiettivo ancora incompleti: impostazione basata sul profilo di rischio";
  }
  const voci = PORTAFOGLIO_PROPOSTE[tipo].map(([prodotto, perc], i) => ({ id:"p" + (i + 1), prodotto, perc }));
  return { tipo, motivo, voci };
}
function vociPortafoglio(progetto, capacita, opportunita){
  const prop = propostaPortafoglio(progetto, capacita, opportunita);
  const custom = progetto.portafoglio && Array.isArray(progetto.portafoglio.voci) ? progetto.portafoglio.voci : null;
  return { voci: custom || prop.voci, personalizzato: !!custom, proposta: prop };
}
// Ripartisce "totale" in numeri interi proporzionali ai pesi (somma sempre = totale)
function distribuisci(pesi, totale){
  if(!pesi.length) return [];
  const somma = pesi.reduce((a, b) => a + b, 0);
  const raw = somma > 0 ? pesi.map(w => w / somma * totale) : pesi.map(() => totale / pesi.length);
  const base = raw.map(Math.floor);
  let resto = totale - base.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - base[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if(resto > 0){ base[i]++; resto--; } });
  return base;
}
// Le voci modificate a mano restano "bloccate" (bloccata:true): i riequilibri toccano solo le voci libere.
// Se non resta nessuna voce libera, i blocchi vengono rilasciati e il resto si ripartisce su tutte le altre.
function setPercVoce(voci, id, nuova){
  if(voci.length === 1) return [{...voci[0], perc:100}];
  const altri = voci.filter(v => v.id !== id);
  let liberi = altri.filter(v => !v.bloccata);
  let perc = Math.max(0, Math.min(100, Math.round(Number(nuova) || 0)));
  let rilascia = false;
  if(!liberi.length){ liberi = altri; rilascia = true; }
  const fissi = altri.filter(v => !liberi.includes(v)).reduce((a, v) => a + v.perc, 0);
  perc = Math.min(perc, 100 - fissi);
  const rip = distribuisci(liberi.map(v => v.perc), 100 - fissi - perc);
  return voci.map(v => {
    if(v.id === id) return {...v, perc, bloccata:true};
    const k = liberi.indexOf(v);
    if(k < 0) return v;
    return {...v, perc: rip[k], ...(rilascia ? {bloccata:false} : {})};
  });
}
const PORT_ROSSI = ["#E8586C","#A31C34","#F3A6B0","#5A0F1D"];
const PORT_GRIGI = ["#5B6168","#9AA0A6","#1F1F1F","#D9D9DC"];
const isRosso = (hex) => { const n = parseInt(hex.slice(1), 16); return (n >> 16) - (n & 255) > 40; };
// nuovo spicchio: alterna rosso / grigio rispetto al precedente, usando una tinta non ancora usata
const coloreExtra = (voci) => {
  const usati = voci.map(coloreVoce);
  const ultimo = voci.length ? usati[usati.length - 1] : null;
  const famiglia = ultimo && isRosso(ultimo) ? PORT_GRIGI : PORT_ROSSI;
  const altra = famiglia === PORT_GRIGI ? PORT_ROSSI : PORT_GRIGI;
  return famiglia.find(c => !usati.includes(c)) || altra.find(c => !usati.includes(c)) || famiglia[usati.length % famiglia.length];
};
function bloccaVoce(voci, id){
  return voci.map(v => v.id === id ? {...v, bloccata: !v.bloccata} : v);
}
function aggiungiVoce(voci){
  const id = "v" + Date.now() + Math.floor(Math.random() * 1000);
  const colore = coloreExtra(voci);
  if(!voci.length) return [{ id, prodotto:"", nuovo:true, colore, perc:100 }];
  let liberi = voci.filter(v => !v.bloccata);
  let rilascia = false;
  if(liberi.reduce((a, v) => a + v.perc, 0) < 10){ liberi = voci; rilascia = true; }
  const somma = liberi.reduce((a, v) => a + v.perc, 0);
  const presa = Math.min(10, somma);
  const rip = distribuisci(liberi.map(v => v.perc), somma - presa);
  const nuove = voci.map(v => {
    const k = liberi.indexOf(v);
    return k < 0 ? v : {...v, perc: rip[k], ...(rilascia ? {bloccata:false} : {})};
  });
  return [...nuove, { id, prodotto:"", nuovo:true, colore, perc:presa }];
}
function rimuoviVoce(voci, id){
  const r = voci.filter(v => v.id !== id);
  if(!r.length) return r;
  let liberi = r.filter(v => !v.bloccata);
  let rilascia = false;
  if(!liberi.length){ liberi = r; rilascia = true; }
  const fissi = r.filter(v => !liberi.includes(v)).reduce((a, v) => a + v.perc, 0);
  const n = distribuisci(liberi.map(v => v.perc), 100 - fissi);
  return r.map(v => {
    const k = liberi.indexOf(v);
    return k < 0 ? v : {...v, perc: n[k], ...(rilascia ? {bloccata:false} : {})};
  });
}

// colore più chiaro / testo leggibile sopra al colore dello spicchio
const mixColore = (hex, t) => {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * t));
  return "rgb(" + c.join(",") + ")";
};
const testoSu = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  const L = 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
  return L > 150 ? "#262626" : "#fff";
};
const polare = (cx, cy, r, deg) => [cx + r * Math.cos((deg - 90) * Math.PI / 180), cy + r * Math.sin((deg - 90) * Math.PI / 180)];
function arcoCiambella(cx, cy, r0, r1, a0, a1){
  const fine = Math.min(a1, a0 + 359.99);
  const [x0, y0] = polare(cx, cy, r1, a0), [x1, y1] = polare(cx, cy, r1, fine);
  const [x2, y2] = polare(cx, cy, r0, fine), [x3, y3] = polare(cx, cy, r0, a0);
  const g = fine - a0 > 180 ? 1 : 0;
  return "M" + x0 + " " + y0 + "A" + r1 + " " + r1 + " 0 " + g + " 1 " + x1 + " " + y1 +
         "L" + x2 + " " + y2 + "A" + r0 + " " + r0 + " 0 " + g + " 0 " + x3 + " " + y3 + "Z";
}
function righeCentro(nome){
  const righe = []; let cur = "";
  nome.split(" ").forEach(w => { if((cur + " " + w).trim().length > 15){ righe.push(cur); cur = w; } else cur = (cur + " " + w).trim(); });
  if(cur) righe.push(cur);
  return righe.slice(0, 3);
}

// rossi vicini ai rossi e grigi vicini ai grigi (ordine stabile all'interno di ogni gruppo)
const raggruppaPerTinta = (voci) => [...voci.map((v, i) => [v, i])].sort((a, b) => (isRosso(coloreVoce(b[0])) - isRosso(coloreVoce(a[0]))) || (a[1] - b[1])).map(x => x[0]);
function PieChart({voci, activeId, onHover, onPin}){
  // le percentuali mostrate "scorrono" verso i nuovi valori: i ribilanciamenti si vedono
  const target = {};
  voci.forEach(v => { target[v.id] = v.perc; });
  const [disp, setDisp] = useState(() => { const o = {}; voci.forEach(v => { o[v.id] = 0; }); return o; });
  const dispRef = useRef(disp);
  useEffect(() => {
    const from = {...dispRef.current};
    const t0 = performance.now(), DUR = 520;
    let raf;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / DUR), e = 1 - Math.pow(1 - k, 3);
      const next = {};
      Object.keys(target).forEach(id => { const a = from[id] || 0; next[id] = a + (target[id] - a) * e; });
      dispRef.current = next; setDisp(next);
      if(k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [voci.map(v => v.id + ":" + v.perc).join("|")]);

  const CX = 150, CY = 150, R0 = 60, R1 = 108;
  const vis = raggruppaPerTinta(voci).map(v => ({...v, d: disp[v.id] || 0})).filter(v => v.d > 0.05);
  const tot = vis.reduce((a, v) => a + v.d, 0) || 1;
  // rossi in alto a sinistra, grigi in basso a destra: la linea di separazione sale da sinistra-basso a destra-alto
  const dRossi = vis.filter(v => isRosso(coloreVoce(v))).reduce((x, v) => x + v.d, 0);
  const haMisto = dRossi > 0 && dRossi < tot - 0.001;
  let acc = haMisto ? 330 - (dRossi / tot * 360) / 2 : 0;
  const fette = vis.map(v => {
    const span = v.d / tot * 360, gap = vis.length > 1 ? 1.4 : 0;
    const a0 = acc + gap / 2, a1 = acc + span - gap / 2, mid = acc + span / 2;
    acc += span;
    return {...v, a0, a1, mid, span};
  });
  const att = voci.find(v => v.id === activeId);
  const cols = [...new Set(voci.map(v => coloreVoce(v)))];
  return (
    <svg viewBox="0 0 300 300" className="port-pie" role="img"
         aria-label={"Composizione: " + voci.map(v => nomeVoce(v) + " " + v.perc + "%").join(", ")}>
      <defs>
        {cols.map(c => (
          <linearGradient key={c} id={"pg" + c.slice(1)} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={mixColore(c, 0.16)}/><stop offset="100%" stopColor={c}/>
          </linearGradient>
        ))}
        <radialGradient id="pgGlow" cx="50%" cy="50%" r="50%"><stop offset="70%" stopColor="#F6F4F0"/><stop offset="100%" stopColor="#F3F1EC" stopOpacity="0"/></radialGradient>
      </defs>
      <circle cx={CX} cy={CY} r="146" fill="url(#pgGlow)" pointerEvents="none"/>
      <circle cx={CX} cy={CY} r={(R0 + R1) / 2} fill="none" stroke="#E3E0D8" strokeWidth={R1 - R0} pointerEvents="none"/>
      {fette.map(f => {
        const on = f.id === activeId, dim = activeId && !on;
        const [dx, dy] = polare(0, 0, on ? 7 : 0, f.mid);
        return (
          <g key={f.id} className="port-slice" style={{transform:"translate(" + dx + "px," + dy + "px)", opacity: dim ? 0.72 : 1}}
             onMouseEnter={()=>onHover(f.id)} onMouseLeave={()=>onHover(null)} onClick={()=>onPin(f.id)}>
            <path d={arcoCiambella(CX, CY, R0, R1, f.a0, f.a1)} fill={"url(#pg" + coloreVoce(f).slice(1) + ")"}
                  stroke="#fff" strokeWidth="1.6" strokeLinejoin="round"/>
          </g>
        );
      })}
      {fette.map(f => {
        if(f.span < 8) return null;
        const on = f.id === activeId, dim = activeId && !on;
        const [dx, dy] = polare(0, 0, on ? 7 : 0, f.mid);
        const [x, y] = polare(CX, CY, (R0 + R1) / 2, f.mid);
        return <text key={"l" + f.id} x={x} y={y} textAnchor="middle" dominantBaseline="central" className="port-slice-label"
                     style={{transform:"translate(" + dx + "px," + dy + "px)", opacity: dim ? 0.42 : 1, fill: testoSu(coloreVoce(f))}}>{Math.round(f.d)}%</text>;
      })}
      {fette.map(f => {
        if(f.span >= 8) return null;
        const [x, y] = polare(CX, CY, R1 + 16, f.mid);
        return <text key={"o" + f.id} x={x} y={y} textAnchor="middle" dominantBaseline="central" className="port-slice-label out"
                     style={{opacity: activeId && f.id !== activeId ? 0.42 : 1}}>{Math.round(f.d)}%</text>;
      })}
      <circle cx={CX} cy={CY} r={R0 - 2} fill="#fff" stroke="#E3E0D8" strokeWidth="1.5" pointerEvents="none"/>
      {att ? (
        <g className="port-center" key={att.id}>
          <text x={CX} y={CY - 6 - (righeCentro(nomeVoce(att)).length - 1) * 5} textAnchor="middle" className="port-pie-num" style={{fill: testoSu(coloreVoce(att)) === "#fff" ? coloreVoce(att) : "#6B7076"}}>{att.perc}%</text>
          {righeCentro(nomeVoce(att)).map((r, k, a) => (
            <text key={k} x={CX} y={CY + 12 + k * 11 - (a.length - 1) * 5} textAnchor="middle" className="port-pie-sub">{r}</text>
          ))}
        </g>
      ) : (
        <g>
          <text x={CX} y={CY - 2} textAnchor="middle" className="port-pie-num">{voci.length ? "100%" : "—"}</text>
          <text x={CX} y={CY + 17} textAnchor="middle" className="port-pie-sub">{voci.length + (voci.length === 1 ? " prodotto" : " prodotti")}</text>
        </g>
      )}
    </svg>
  );
}

function PortafoglioSection({progetti, progettoAttivoId, onSelectProgetto, capacita, opportunita, onChange}){
  const p = progetti.find(x => x.id === progettoAttivoId) || progetti[0];
  const {voci, personalizzato, proposta} = vociPortafoglio(p, capacita, opportunita);
  // L'effetto sullo spicchio dura qualche secondo, poi il grafico torna alla vista completa
  const FOCUS_MS = 4000;
  const [activeId, setActiveId] = useState(null);
  const focusTimer = useRef(null);
  const focus = (id) => {
    clearTimeout(focusTimer.current);
    setActiveId(id);
    if(id) focusTimer.current = setTimeout(() => setActiveId(null), FOCUS_MS);
  };
  const toggleFocus = (id) => focus(activeId === id ? null : id);
  const pulse = focus;
  useEffect(() => () => clearTimeout(focusTimer.current), []);
  const commit = (nuove, idModificato) => { onChange(p.id, { voci: nuove }); if(idModificato) pulse(idModificato); };
    return (
    <section className="port-wrap">
      <div className="port-head">
        <h2>Strategia portafoglio</h2>
        <p>La composizione di partenza dipende dal rendimento che serve per raggiungere ogni obiettivo. Puoi cambiare liberamente prodotti e percentuali.</p>
      </div>
      <div className="progetti-row">
        {progetti.map(x => (
          <button type="button" key={x.id} className={"progetto-tab" + (x.id === p.id ? " active" : "")} style={{padding:"9px 18px"}} onClick={()=>onSelectProgetto(x.id)}>
            <span className="progetto-tab-label">{x.nome}</span>
          </button>
        ))}
      </div>
      <div className="port-card">
        <div className="port-card-head">
          <span className="port-card-title">{p.nome}</span>
          <span className={"port-badge" + (personalizzato ? " custom" : "")}>{personalizzato ? "Personalizzata" : "Proposta automatica"}</span>
        </div>
        <div className="port-basis">
          <b>{proposta.tipo === "prudente" ? "Impostazione prudente" : "Impostazione orientata alla crescita"}</b>: {proposta.motivo}.
        </div>
        <div className="port-body">
          <div className="port-pie-col">
            <PieChart voci={voci} activeId={activeId} onHover={(id)=>{ if(id) focus(id); }} onPin={toggleFocus}/>
            <div className="port-legend">
              {raggruppaPerTinta(voci).filter(v => v.perc > 0).map(v => (
                <div className={"port-legend-row" + (activeId === v.id ? " active" : "")} key={v.id}
                     onMouseEnter={()=>focus(v.id)} onClick={()=>toggleFocus(v.id)}><span className="port-dot" style={{background:coloreVoce(v)}}/><span className="pl-name">{nomeVoce(v)}</span><b>{v.perc}%</b></div>
              ))}
            </div>
          </div>
          <div className="port-lines">
            {voci.length === 0 && <p className="port-empty">Nessun prodotto: aggiungine uno per comporre il portafoglio.</p>}
            {voci.map(v => {
              const disponibili = PORTAFOGLIO_PRODOTTI.filter(x => x.nome === v.prodotto || !voci.some(o => o.prodotto === x.nome));
              return (
                <div className={"port-line" + (activeId === v.id ? " active" : "")} key={v.id}
                     onMouseEnter={()=>focus(v.id)}>
                  <div className="port-line-top">
                    <span className="port-dot" style={{background:coloreVoce(v)}}/>
                    {v.manuale ? (
                      <>
                        <input type="text" className="port-select port-name" value={v.prodotto} maxLength={40} placeholder="Nome del nuovo prodotto" autoFocus={!v.prodotto}
                          aria-label="Nome del prodotto"
                          onChange={(e)=>commit(voci.map(o => o.id === v.id ? {...o, prodotto:e.target.value} : o), v.id)}/>
                      </>
                    ) : (
                    <select
                      className="port-select"
                      value={v.prodotto}
                      aria-label="Prodotto"
                      ref={(el)=>{ if(el && v.nuovo && !PORT_APERTI.has(v.id)){ PORT_APERTI.add(v.id); setTimeout(()=>{ try{ el.focus(); if(el.showPicker) el.showPicker(); }catch(e){} }, 60); } }}
                      onChange={(e)=>{
                        const val = e.target.value;
                        if(val === "__altro__") commit(voci.map(o => o.id === v.id ? {...o, prodotto:"", manuale:true, nuovo:false, colore:o.colore || coloreExtra(voci.filter(x => x.id !== o.id))} : o), v.id);
                        else commit(voci.map(o => { if(o.id !== v.id) return o; const {colore, manuale, nuovo, ...r} = o; return {...r, prodotto:val}; }), v.id);
                      }}
                    >
                      {!v.prodotto && <option value="" disabled>Scegli il prodotto…</option>}
                      {disponibili.map(x => <option key={x.nome} value={x.nome}>{x.nome}</option>)}
                      <option value="__altro__">Altro prodotto (scrivi il nome)…</option>
                    </select>
                    )}
                    <button type="button" className={"port-lock" + (v.bloccata ? " on" : "")} title={v.bloccata ? "Percentuale bloccata: tocca per sbloccarla" : "Tocca per bloccare la percentuale"} aria-pressed={!!v.bloccata} aria-label={"Blocca " + nomeVoce(v)} onClick={()=>commit(bloccaVoce(voci, v.id), v.id)}>
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/>{v.bloccata ? <path d="M8 11V8a4 4 0 0 1 8 0v3"/> : <path d="M8 11V8a4 4 0 0 1 7-2.6"/>}</svg>
                    </button>
                    <button type="button" className="port-remove" title="Rimuovi il prodotto" aria-label={"Rimuovi " + nomeVoce(v)} onClick={()=>commit(rimuoviVoce(voci, v.id))}>×</button>
                  </div>
                  <div className="port-line-bottom">
                    <input
                      type="range" min="0" max="100" step="1" value={v.perc}
                      className="port-range" style={{accentColor:coloreVoce(v)}}
                      aria-label={"Percentuale " + nomeVoce(v)}
                      onChange={(e)=>commit(setPercVoce(voci, v.id, e.target.value), v.id)}
                    />
                    <span className="port-perc">
                      <PercInput value={v.perc} label={"Percentuale " + nomeVoce(v) + " (numero)"}
                        onCommit={(val)=>commit(setPercVoce(voci, v.id, val), v.id)}/>%
                    </span>
                  </div>
                </div>
              );
            })}
            <div className="port-actions">
              <button type="button" className="add-familiare-btn" onClick={()=>{ const n = aggiungiVoce(voci); commit(n, n.length ? n[n.length - 1].id : null); }}>+ Aggiungi prodotto</button>
              {personalizzato && <button type="button" className="add-familiare-btn" onClick={()=>onChange(p.id, null)}>Ripristina la proposta</button>}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---------------- Main App ---------------- */
function App(){
  const [appState, setAppState] = useState(DEFAULT_APP_STATE);
  const {progettiVita, progetti, activeProgettoId, capacita, opportunita, cliente, familiari} = appState;
  const activeProgetto = progetti.find(p => p.id === activeProgettoId) || progetti[0];
  const {obiettivo, tempo} = activeProgetto;

  // Ordina i progetti per priorità: risposta 3 della colonna Obiettivo
  // (importanzaObiettivo, scala 1-10). Punteggio più alto = priorità più alta.
  const progettoCompleto = (pr) => !!(pr.obiettivo.capitaleObiettivo && pr.obiettivo.disponibilitaAttuale !== ""
    && pr.obiettivo.importanzaObiettivo != null && pr.obiettivo.risultatoAtteso
    && getHorizonYears(pr.tempo) != null && pr.tempo.accessoImprevisto && pr.tempo.maggiorTempo);
  const schedeBloccate = progetti.length > 1 && !progetti.every(progettoCompleto);
  const progettiOrdinati = [...progetti].sort((a,b) => {
    const pa = a.obiettivo.importanzaObiettivo;
    const pb = b.obiettivo.importanzaObiettivo;
    return (pb==null ? -1 : pb) - (pa==null ? -1 : pa);
  });

  // Riferimento alla radice ".app": è l'elemento "fotografato" da
  // html2canvas per generare il PDF (vedi handlePrint più sotto).
  const appRef = useRef(null);

  const updateProgettiVita = (v) => setAppState(prev => ({...prev, progettiVita: v}));

  const updateObiettivo = (patch) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===prev.activeProgettoId ? applyObiettivoPatch(p, patch) : p)
  }));
  const updateTempo = (patch) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===prev.activeProgettoId ? {...p, tempo:{...p.tempo, ...patch}} : p)
  }));
  const updateCapacita = (patch) => setAppState(prev => ({...prev, capacita: {...prev.capacita, ...patch}}));
  const updateOpportunita = (patch) => setAppState(prev => ({...prev, opportunita: {...prev.opportunita, ...patch}}));
  const revealOpportunita = () => setAppState(prev => ({...prev, opportunita: {...prev.opportunita, revealed:true}}));
  const removeOpportunita = () => {
    const o = opportunita;
    const hasData = !!(o.primaCosa || o.comfort != null || o.azioneCalo || asStrumentiList(o.strumenti).length > 0 || o.crolloReale);  // le durate dipendono dagli strumenti scelti
    if(hasData){
      const ok = window.confirm("Eliminare la scheda Opportunità? I dati inseriti andranno persi.");
      if(!ok) return;
    }
    setAppState(prev => ({...prev, opportunita: DEFAULT_OPPORTUNITA()}));
  };
  const updateCliente = (patch) => setAppState(prev => ({...prev, cliente: {...prev.cliente, ...patch}}));

  // ---------------- Progetti (schede sovrapposte, come pagine Excel) ----------------
  const selectProgetto = (id) => setAppState(prev => ({...prev, activeProgettoId: id}));
  const renameProgetto = (id, nome) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===id ? {...p, nome} : p)
  }));
  const addProgetto = () => {
    const newId = "progetto-" + Date.now() + "-" + Math.floor(Math.random()*1000);
    setAppState(prev => ({
      ...prev,
      progetti: [...prev.progetti, {
        id: newId,
        nome: "Obiettivo " + (prev.progetti.length + 1),
        obiettivo: DEFAULT_OBIETTIVO(),
        tempo: DEFAULT_TEMPO(),
        premioUnico: "",
        premioPeriodico: null
      }],
      activeProgettoId: newId
    }));
  };
  const deleteProgetto = (id) => {
    setAppState(prev => {
      if(prev.progetti.length<=1) return prev; // mantieni sempre almeno una scheda
      const remaining = prev.progetti.filter(p => p.id!==id);
      const activeProgettoId = prev.activeProgettoId===id ? remaining[0].id : prev.activeProgettoId;
      return {...prev, progetti: remaining, activeProgettoId};
    });
  };

  // ---------------- Priorità: premio unico + premio periodico per progetto ----------------
  const updatePremioUnico = (progettoId, digits) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===progettoId ? {...p, premioUnico: digits} : p)
  }));
  const addPremioPeriodico = (progettoId) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===progettoId ? {...p, premioPeriodico: {importo:"", frequenza:null}} : p)
  }));
  const updatePremioPeriodico = (progettoId, patch) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===progettoId
      ? {...p, premioPeriodico: {...(p.premioPeriodico || {importo:"", frequenza:null}), ...patch}} : p)
  }));
  const removePremioPeriodico = (progetto) => {
    const pp = progetto.premioPeriodico;
    if(pp && (pp.importo || pp.frequenza) && !window.confirm("Rimuovere il premio periodico? I dati inseriti andranno persi.")) return;
    setAppState(prev => ({
      ...prev,
      progetti: prev.progetti.map(p => p.id===progetto.id ? {...p, premioPeriodico: null} : p)
    }));
  };

  const addFamiliare = () => setAppState(prev => ({
    ...prev,
    familiari: [...prev.familiari, {id: Date.now()+Math.random(), parentela:"", nome:"", cognome:"", dataNascita:"", codiceFiscale:"", residenza:""}]
  }));
  const updateFamiliare = (id, field, value) => setAppState(prev => ({
    ...prev,
    familiari: prev.familiari.map(f => f.id===id ? {...f, [field]: value} : f)
  }));
  const removeFamiliare = (id) => setAppState(prev => ({
    ...prev,
    familiari: prev.familiari.filter(f => f.id!==id)
  }));

  // ANAGRAFICA CLIENTE — modale
  const [clienteModalOpen, setClienteModalOpen] = useState(false);
  // PROFILO DI RISCHIO — modale (nessuna informazione mostrata finché non si apre)
  const [profiloModalOpen, setProfiloModalOpen] = useState(false);

  // ---------------- Blocco schede: dimensione fissa, sempre intere ----------------
  // La larghezza di ogni scheda è calcolata sullo spazio disponibile in modo che
  // Obiettivo, Tempo e Capacità (più i connettori) entrino sempre per intero, senza
  // tagli. Resta la stessa quando compare Opportunità: in quel caso la quarta
  // scheda sta oltre il bordo e il blocco si sposta con swipe o frecce, lasciando
  // fermo tutto il resto della pagina.
  const columnsRowRef = useRef(null);
  const [canScrollLeft, setCanScrollLeft] = useState(false);
  const [canScrollRight, setCanScrollRight] = useState(false);
  const updateColumnsNav = () => {
    const el = columnsRowRef.current;
    if(!el) return;
    setCanScrollLeft(el.scrollLeft > 4);
    setCanScrollRight(el.scrollLeft + el.clientWidth < el.scrollWidth - 4);
  };
  const fitCards = () => {
    const el = columnsRowRef.current;
    if(!el) return;
    if(window.innerWidth <= 860){          // layout verticale (telefono/tablet in verticale)
      el.style.removeProperty("--card-w");
      el.style.removeProperty("--arrow-w");
    } else {
      const W = el.clientWidth;
      const arrowW = W >= 1180 ? 46 : 34;
      const cardW = Math.max(280, Math.min(370, Math.floor((W - 3 * arrowW) / 3)));
      el.style.setProperty("--card-w", cardW + "px");
      el.style.setProperty("--arrow-w", arrowW + "px");
    }
    updateColumnsNav();
  };
  useEffect(() => {
    fitCards();
    window.addEventListener("resize", fitCards);
    window.addEventListener("orientationchange", fitCards);
    let ro = null;
    if(window.ResizeObserver && columnsRowRef.current){
      ro = new ResizeObserver(fitCards);
      ro.observe(columnsRowRef.current);
    }
    return () => {
      window.removeEventListener("resize", fitCards);
      window.removeEventListener("orientationchange", fitCards);
      if(ro) ro.disconnect();
    };
  }, [progetti.length, opportunita.revealed]);
  // Quando si aggiunge Opportunità, porta la nuova scheda in vista
  const prevRevealedRef = useRef(opportunita.revealed);
  useEffect(() => {
    if(opportunita.revealed && !prevRevealedRef.current){
      setTimeout(() => {
        const el = columnsRowRef.current;
        if(el && window.innerWidth > 860) el.scrollTo({left: el.scrollWidth, behavior: "smooth"});
      }, 120);
    }
    prevRevealedRef.current = opportunita.revealed;
  }, [opportunita.revealed]);
  const scrollColumns = (direction) => {
    const el = columnsRowRef.current;
    if(!el) return;
    const w = parseFloat(el.style.getPropertyValue("--card-w")) || 370;
    el.scrollBy({left: direction * (w + 40), behavior: "smooth"});
  };

  // ---------------- Import / Export / Print ----------------
  const [importMsg, setImportMsg] = useState(null);
  const [pdfBusy, setPdfBusy] = useState(false);
  const [vista, setVista] = useState("questionario");        // "questionario" | "portafoglio"
  const [menuOpen, setMenuOpen] = useState(false);
  const [portProgettoId, setPortProgettoId] = useState(null);
  const updatePortafoglio = (progettoId, portafoglio) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id === progettoId ? {...p, portafoglio} : p)
  }));
  const [pdfReady, setPdfReady] = useState(null);   // { blob, name } — PDF pronto, in attesa di nome e salvataggio

  // Nome file suggerito in fase di esportazione: "Strategia Generali per [Cliente]"
  const buildSuggestedFilename = () => {
    const nomeCompleto = [cliente?.nome, cliente?.cognome].filter(Boolean).join(" ").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
    const base = nomeCompleto ? `Strategia Generali per ${nomeCompleto}` : "Strategia Generali";
    return `${base}.json`;
  };

  const handleExport = async () => {
    const suggestedName = buildSuggestedFilename();
    const jsonString = buildExportPayload(appState);

    // 1) Chrome (desktop/Android) e altri browser con File System Access API:
    // apre la vera finestra di sistema "Salva con nome".
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName,
          types: [{ description: "File JSON", accept: {"application/json": [".json"]} }]
        });
        const writable = await handle.createWritable();
        await writable.write(jsonString);
        await writable.close();
        setImportMsg({type:"ok", text:"Esportazione completata."});
      } catch (err) {
        if (err && err.name !== "AbortError") {
          console.error("Errore durante l'esportazione:", err);
          setImportMsg({type:"err", text:"Impossibile esportare il file."});
        }
      }
      return;
    }

    // 2) iPad/iPhone (Safari) e altri browser con Web Share API: apre il foglio di
    // condivisione di sistema, dove "Salva in File" permette di scegliere la
    // cartella (e in genere anche di modificare il nome prima di salvare).
    try {
      // Alcune versioni di iOS accettano nel foglio di condivisione solo certi tipi di file:
      // si prova prima come JSON e, se rifiutato, come testo (stesso nome .json)
      const candidati = ["application/json", "text/plain"].map(t => new File([jsonString], suggestedName, {type: t}));
      const file = navigator.canShare ? candidati.find(f => navigator.canShare({files:[f]})) : null;
      if (file) {
        await navigator.share({files:[file]});
        setImportMsg({type:"ok", text:"Esportazione completata."});
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return; // utente ha annullato la condivisione
      console.error("Errore durante la condivisione:", err);
      // in caso di altro errore, prosegue con il fallback finale sotto
    }

    // 3) Fallback finale per browser privi delle API sopra: download diretto
    // col nome suggerito.
    const ok = exportProjectData(appState, suggestedName);
    if(ok) setImportMsg({type:"ok", text:"Esportazione completata."});
  };

  const handleImportClick = () => {
    triggerImport(setAppState, DEFAULT_APP_STATE, (msg) => setImportMsg(msg));
  };

  // Genera il PDF interamente lato client (html2canvas "fotografa" la
  // stessa identica grafica della stampa — vedi .pdf-capture nel CSS — e
  // jsPDF la impagina su più pagine A4), poi lo consegna con l'API nativa
  // di condivisione. Funziona allo stesso modo su qualsiasi dispositivo,
  // incluse le app installate su iPad/iPhone (modalità standalone), dove
  // window.print() è un limite noto di WebKit e non apre mai la stampa.
  const handlePrint = async () => {
    const el = appRef.current;
    if (!el || !window.html2canvas || !window.jspdf) {
      window.print(); // ultimo fallback, solo se le librerie non sono disponibili
      return;
    }
    setPdfBusy(true);
    el.classList.add("pdf-capture");
    // assicura che i font (Oswald/Inter) siano completamente caricati prima
    // dello screenshot, altrimenti html2canvas può "fotografare" un font
    // di fallback diverso da quello mostrato a schermo
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
    } catch (e) {}
    // lascia che il browser applichi gli stili prima dello screenshot
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    try {
      const blob = await buildPdfBlobFromElement(el);
      // Il PDF richiede qualche secondo: dopo l'attesa iOS non concede più la condivisione
      // "automatica". Si chiede quindi il nome in una finestra dell'app e il salvataggio
      // parte da un nuovo tocco dell'utente.
      const nomeBase = buildSuggestedFilename().replace(/\.json$/i, "");
      setPdfReady({ blob, name: nomeBase });
    } catch (err) {
      console.error("Errore durante la generazione del PDF:", err);
      setImportMsg({type:"err", text:"Impossibile generare il PDF."});
    } finally {
      el.classList.remove("pdf-capture");
      setPdfBusy(false);
    }
  };

  const confirmPdfSave = async () => {
    if(!pdfReady) return;
    const pulito = (pdfReady.name || "").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim().replace(/\.pdf$/i, "");
    const filename = (pulito || "Strategia Generali") + ".pdf";
    const blob = pdfReady.blob;
    try {
      const file = new File([blob], filename, { type: "application/pdf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        setPdfReady(null);
        setImportMsg({type:"ok", text:"PDF generato."});
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;   // annullato: la finestra resta aperta per riprovare
      console.error("Errore durante la condivisione del PDF:", err);
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.setAttribute("download", filename);
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    setTimeout(() => { document.body.removeChild(link); URL.revokeObjectURL(url); }, 150);
    setPdfReady(null);
    setImportMsg({type:"ok", text:"PDF generato."});
  };

  const obiettivoSummary = () => {
    const {capitaleObiettivo, disponibilitaAttuale, importanzaObiettivo} = obiettivo;
    if(!capitaleObiettivo && !disponibilitaAttuale && importanzaObiettivo==null) return "Definiamo insieme i tuoi obiettivi e le tue priorità.";
    const parts = [];
    if(capitaleObiettivo) parts.push(`Capitale: € ${formatCurrencyDigits(capitaleObiettivo)}`);
    if(disponibilitaAttuale) parts.push(`Disponibilità: € ${formatCurrencyDigits(disponibilitaAttuale)}`);
    if(importanzaObiettivo!=null) parts.push(`Priorità: ${importanzaObiettivo}/10`);
    return parts.join(" · ");
  };

  const tempoSummary = () => {
    const anniTempo = getHorizonYears(tempo);

    const parts = [];
    if(anniTempo != null) parts.push(`Orizzonte: ${formatAnni(anniTempo)}`);
    if(accessoImprevisto) parts.push(`Accesso al capitale: ${accessoImprevisto}`);
    return parts.length ? parts.join(" · ") : "Valutiamo insieme il tuo orizzonte temporale e le tue esigenze di liquidità.";
  };

  const capacitaSummary = () => {
    const {quotaPatrimonio, redditoImpegnato, spesaPiu20} = capacita;

    if(strumenti.length) parts.push(`Esperienza: ${strumenti.join(", ")}`);

      <path d="M9 5l7 7-7 7"/>
    </svg>
  );

            {obiettivo.disponibilitaAttuale !== "" && (

                    <CurrencyInput value={obiettivo.integrazioneMensile} onChange={(v)=>updateObiettivo({integrazioneMensile:v})}/>

                  <select

                  </select>
                </div>

            <Question icon={<StarIcon/>} number="3" text="Quanto è importante raggiungere questo obiettivo per te?">
              <ScaleQuestion value={obiettivo.importanzaObiettivo} onChange={(v)=>updateObiettivo({importanzaObiettivo:v})}/>

                value={obiettivo.risultatoAtteso}

            <div style={{flex:1}}/>

                  value={opportunita.strumenti}

                />
              </Question>
              {asStrumentiList(opportunita.strumenti).length > 0 && (
                <Question className="reveal" icon={<CalendarIcon/>} number="4.1" text="Per quanto tempo hai detenuto ciascuno di questi strumenti?">
                  <DurataStrumenti
                    strumenti={opportunita.strumenti}
                    durate={opportunita.strumentiDurata}
                    onChange={(d)=>updateOpportunita({strumentiDurata:d})}
                  />
                </Question>
              )}
              {crolloApplicabile(opportunita) && (
                <Question className="reveal" icon={<ShieldPctIcon/>} number="4.2" text="Cosa hai fatto realmente nei forti cali di mercato del 2020 o del 2022?">
                  <ChoiceQuestion
                    options={["Ho venduto tutto o quasi","Ho venduto una parte","Ho mantenuto la posizione","Ho investito di più approfittando dei prezzi bassi"]}
                    value={opportunita.crolloReale}
                    onChange={(v)=>updateOpportunita({crolloReale:v})}
                  />
                </Question>
              )}
              <div style={{flex:1}}/>
              <PromiseBox icon={<TrendIcon/>} text={opportunitaSummary()}/>
            </div>
          </div>
        )}

      </div>
      </div>

      <div className="print-only print-schede">
        {progetti.map(p => {
          return (
          <div className="print-progetto" key={p.id}>
            <h2 className="print-progetto-title">{p.nome}</h2>
            <table className="print-table">
              <tbody>
                <tr className="print-section-row"><td colSpan="2">OBIETTIVO</td></tr>
                <tr>
                  <td>1. Quanto capitale immagini possa servire per realizzare il tuo obiettivo?</td>
                  <td>{p.obiettivo.capitaleObiettivo ? `€ ${formatCurrencyDigits(p.obiettivo.capitaleObiettivo)}` : "—"}</td>
                </tr>
                <tr>
                  <td>2. Qual'è la disponibilità attuale per realizzare le fondamenta di questo obiettivo?</td>
                  <td>{p.obiettivo.disponibilitaAttuale ? `€ ${formatCurrencyDigits(p.obiettivo.disponibilitaAttuale)}` : "—"}</td>
                </tr>
                <tr>
                  <td>2.1. Versamento/accumulo per l'obiettivo{currencyDigitsToNumber(p.obiettivo.disponibilitaAttuale) === 0 && p.obiettivo.disponibilitaAttuale !== "" ? "" : " (mensile)"}</td>
                  <td>{p.obiettivo.integrazioneMensile ? `€ ${formatCurrencyDigits(p.obiettivo.integrazioneMensile)}${" — " + frequenzaIntegrazione(p.obiettivo)}` : "—"}</td>
                </tr>
                <tr>
                  <td>3. Quanto è importante raggiungere questo obiettivo per te?</td>
                  <td>{p.obiettivo.importanzaObiettivo!=null ? `${p.obiettivo.importanzaObiettivo}/10` : "—"}</td>
                </tr>
                <tr>
                  <td>4. Cosa vorresti ottenere da questo investimento?</td>
                  <td>{p.obiettivo.risultatoAtteso || "—"}</td>
                </tr>

                <tr className="print-section-row"><td colSpan="2">TEMPO</td></tr>
                <tr>
                  <td>1. Tra quanti anni vorresti vedere il tuo progetto realizzarsi?</td>
                  <td>{getHorizonYears(p.tempo) != null ? formatAnni(getHorizonYears(p.tempo)) : "—"}</td>
                </tr>
                <tr>
                  <td>2. Se si verificasse un imprevisto personale, quanto sarebbe importante poter accedere al capitale investito?</td>
                  <td>{p.tempo.accessoImprevisto || "—"}</td>
                </tr>
                <tr>
                  <td>3. Ci sono stati episodi in passato che hanno influenzato la gestione dei tuoi investimenti?</td>
                  <td>{p.tempo.esperienze || "—"}</td>
                </tr>
                <tr>
                  <td>4. Se servisse maggior tempo per raggiungere l'obiettivo</td>
                  <td>{p.tempo.maggiorTempo || "—"}</td>
                </tr>

                <tr className="print-section-row"><td colSpan="2">CAPACITÀ</td></tr>
                <tr>
                  <td>1. Quanto rappresenta questo investimento sul totale del tuo patrimonio?</td>
                  <td>{capacita.quotaPatrimonio || "—"}</td>
                </tr>
                <tr>
                  <td>2. Quota di reddito mensile netto già impegnata in rate/mutuo/affitto</td>
                  <td>{capacita.redditoImpegnato || "—"}</td>
                </tr>
                <tr>
                  <td>3. Se le spese aumentassero del 20%</td>
                  <td>{capacita.spesaPiu20 || "—"}</td>
                </tr>
                <tr>
                  <td>4. Importanza di mantenere liquidità sul conto</td>
                  <td>
                    {capacita.liquiditaImportanza || "—"}
                    {capacita.liquiditaImportanza==="Assolutamente" && capacita.liquiditaImportoAssoluto ? ` (€ ${formatCurrencyDigits(capacita.liquiditaImportoAssoluto)})` : ""}
                    {capacita.liquiditaImportanza==="Relativo" && capacita.liquiditaImportoRelativo ? ` (€ ${formatCurrencyDigits(capacita.liquiditaImportoRelativo)})` : ""}
                  </td>
                </tr>

                {opportunita.revealed && (
                  <React.Fragment>
                    <tr className="print-section-row"><td colSpan="2">OPPORTUNITÀ (TOLLERANZA)</td></tr>
                    <tr>
                      <td>1. Cosa cerchi prima di tutto in un investimento?</td>
                      <td>{opportunita.primaCosa || "—"}</td>
                    </tr>
                    <tr>
                      <td>2. A suo agio con la variabilità dei mercati</td>
                      <td>{opportunita.comfort!=null ? `${opportunita.comfort}/10` : "—"}</td>
                    </tr>
                    <tr>
                      <td>3. Se il mercato scendesse temporaneamente del 10%</td>
                      <td>{opportunita.azioneCalo || "—"}</td>
                    </tr>
                    <tr>
                      <td>4. Strumenti detenuti negli ultimi 10 anni</td>
                      <td>{asStrumentiList(opportunita.strumenti).join(", ") || "—"}</td>
                    </tr>
                    {asStrumentiList(opportunita.strumenti).length > 0 && (
                      <tr>
                        <td>4.1. Durata di detenzione</td>
                        <td>{asStrumentiList(opportunita.strumenti).flatMap(x => STRUMENTI_COMPARTI[x].map(c => c + ": " + (formatDurata(durataFor(opportunita.strumentiDurata, c, x)) || "—"))).join(" · ")}</td>
                      </tr>
                    )}
                    {crolloApplicabile(opportunita) && (
                      <tr>
                        <td>4.2. Reazione reale ai crolli 2020/2022</td>
                        <td>{opportunita.crolloReale || "—"}</td>
                      </tr>
                    )}
                  </React.Fragment>
                )}
                {(() => {
                  const pf = vociPortafoglio(p, capacita, opportunita);
                  return (
                    <React.Fragment>
                      <tr className="print-section-row"><td colSpan="2">STRATEGIA PORTAFOGLIO</td></tr>
                      <tr>
                        <td>Impostazione</td>
                        <td>{(pf.proposta.tipo === "prudente" ? "Prudente" : "Orientata alla crescita") + (pf.personalizzato ? " — personalizzata" : " — proposta automatica")}</td>
                      </tr>
                      {pf.voci.length === 0
                        ? <tr><td>Prodotti</td><td>—</td></tr>
                        : pf.voci.map(v => <tr key={v.id}><td>{nomeVoce(v)}</td><td>{v.perc}%</td></tr>)}
                    </React.Fragment>
                  );
                })()}
              </tbody>
            </table>
          </div>
          );
        })}
      </div>

      <div className="priority-banner">
        <div className="pb-header">
          <div className="pb-side pb-side-ghost"></div>
          <div className="pb-header-text">
            <p className="pb-title">Progetto Strategia Generali</p>
            <p className="pb-subtitle">Quanto è disposto a destinare oggi a questo progetto?</p>
          </div>
        </div>
        <div className="pb-body">
          <div className="pb-side"><span>Priorità</span></div>
          <div className="pb-content">
            <div className="priority-list">
              {progettiOrdinati.map(p => (
                <div className="priority-row" key={p.id}>
                  <span className="priority-badge">{p.nome}</span>
                  <div className="prio-group">
                    <div className="prio-pill">
                      <span className="prio-pill-label">Premio unico</span>
                      <span className="prio-euro">€</span>
                      <input
                        type="text"
                        inputMode="numeric"
                        className="prio-input"
                        placeholder="0,00"
                        value={p.premioUnico ? formatCurrencyDigits(p.premioUnico) : ""}
                        onChange={(e)=>updatePremioUnico(p.id, e.target.value.replace(/\D/g, "").replace(/^0+(?=\d)/, ""))}
                        aria-label={"Premio unico — " + p.nome}
                      />
                      <span className={"prio-static" + (p.premioUnico ? "" : " is-placeholder")}>
                        {p.premioUnico ? formatCurrencyDigits(p.premioUnico) : "—"}
                      </span>
                    </div>

                    {p.premioPeriodico ? (
                      <React.Fragment>
                        <div className="prio-pill">
                          <span className="prio-pill-label">Premio periodico</span>
                          <span className="prio-euro">€</span>
                          <input
                            type="text"
                            inputMode="numeric"
                            className="prio-input"
                            placeholder="0,00"
                            value={p.premioPeriodico.importo ? formatCurrencyDigits(p.premioPeriodico.importo) : ""}
                            onChange={(e)=>updatePremioPeriodico(p.id, {importo: e.target.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "")})}
                            aria-label={"Premio periodico — " + p.nome}
                          />
                          <span className={"prio-static" + (p.premioPeriodico.importo ? "" : " is-placeholder")}>
                            {p.premioPeriodico.importo ? formatCurrencyDigits(p.premioPeriodico.importo) : "—"}
                          </span>
                        </div>
                        <div className="prio-pill">
                          <span className="prio-pill-label">Rateazione</span>
                          <select
                            className="prio-select"
                            value={p.premioPeriodico.frequenza || ""}
                            onChange={(e)=>updatePremioPeriodico(p.id, {frequenza: e.target.value || null})}
                            aria-label={"Rateazione premio periodico — " + p.nome}
                          >
                            <option value="">Scegli...</option>
                            {FREQUENZE_PREMIO.map(f => <option key={f} value={f}>{f}</option>)}
                          </select>
                          <span className={"prio-static" + (p.premioPeriodico.frequenza ? "" : " is-placeholder")}>
                            {p.premioPeriodico.frequenza || "—"}
                          </span>
                          <button
                            type="button"
                            className="prio-remove no-print"
                            onClick={()=>removePremioPeriodico(p)}
                            title="Rimuovi il premio periodico"
                          >×</button>
                        </div>
                      </React.Fragment>
                    ) : currencyDigitsToNumber(p.obiettivo.integrazioneMensile) > 0 && (
                      <button
                        type="button"
                        className="prio-add no-print"
                        onClick={()=>addPremioPeriodico(p.id)}
                        title="Aggiungi un premio periodico con rateazione"
                      ><b>+</b> Premio periodico</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="pb-tagline"><p>&ldquo;Diamo VALORE ai tuoi OBIETTIVI.&rdquo;</p></div>
        </div>
      </div>

      <div className="promise-bar">
        <div className="promise-main">
          <div className="promise-item">
            <div className="pi-icon"><PersonIcon/></div>
            <div>
              <h3>LA NOSTRA PROMESSA</h3>
              <p>Ti affianchiamo con competenza, trasparenza e ascolto per aiutarti a prendere decisioni consapevoli.</p>
            </div>
          </div>
        </div>
        <div className="promise-vline"></div>
        <div className="promise-rest">
        <div className="promise-item">
          <div className="pi-icon"><PeopleIcon/></div>
          <div>
            <h3>ASCOLTO</h3>
            <p>Capiamo le tue esigenze per conoscerti veramente.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><SearchIcon/></div>
          <div>
            <h3>ANALISI</h3>
            <p>Valutiamo insieme tutte le variabili che contano.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><CompassIcon/></div>
          <div>
            <h3>PIANIFICAZIONE</h3>
            <p>Costruiamo un piano su misura per i tuoi obiettivi.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><ChartUpIcon/></div>
          <div>
            <h3>MONITORAGGIO</h3>
            <p>Ti accompagniamo nel tempo, adattando la strategia con te.</p>
          </div>
        </div>
        </div>

        <div className="quote">
          <span className="mark">&ldquo;</span>
          <span>Il miglior investimento è quello che ti porta verso il <strong>futuro che desideri</strong>.</span>
          <span className="mark">&rdquo;</span>
        </div>
      </div>

      </div>

      <div className="toolbar no-print">
        <button className="tb-btn" onClick={handlePrint} disabled={pdfBusy}>
          <PrintIcon/> {pdfBusy ? "Generazione PDF…" : "Stampa / Export PDF"}
        </button>
        <button className="tb-btn" onClick={handleImportClick}><UploadIcon/> Importa Progetto</button>
        <button className="tb-btn primary" onClick={handleExport}><DownloadIcon/> Esporta Progetto</button>
      </div>
      {importMsg && <p className={"import-msg no-print " + importMsg.type}>{importMsg.text}</p>}
      {pdfReady && (
        <div className="modal-overlay no-print" onClick={()=>setPdfReady(null)}>
          <div className="modal" style={{maxWidth:440}} onClick={(e)=>e.stopPropagation()}>
            <div className="modal-header">
              <h2>PDF pronto</h2>
              <button className="modal-close" onClick={()=>setPdfReady(null)}>×</button>
            </div>
            <div className="modal-body">
              <div className="modal-grid" style={{gridTemplateColumns:"1fr"}}>
                <label>Nome del file
                  <input
                    type="text"
                    value={pdfReady.name}
                    onChange={(e)=>setPdfReady({...pdfReady, name:e.target.value})}
                    autoFocus
                  />
                </label>
              </div>
              <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:18,flexWrap:"wrap"}}>
                <button type="button" className="add-familiare-btn" onClick={()=>setPdfReady(null)}>Annulla</button>
                <button type="button" className="add-familiare-btn" style={{background:"var(--red)",color:"#fff"}} onClick={confirmPdfSave}>Salva / Condividi</button>
              </div>
            </div>
          </div>
        </div>
      )}

      <ClienteModal
        open={clienteModalOpen}
        onClose={()=>setClienteModalOpen(false)}
        cliente={cliente}
        updateCliente={updateCliente}
        familiari={familiari}
        addFamiliare={addFamiliare}
        updateFamiliare={updateFamiliare}
        removeFamiliare={removeFamiliare}
      />

      <ProfiloModal
        open={profiloModalOpen}
        onClose={()=>setProfiloModalOpen(false)}
        progetti={progetti}
        activeProgettoId={activeProgettoId}
        capacita={capacita}
        opportunita={opportunita}
        onPortafoglio={(id)=>{ setPortProgettoId(id); setProfiloModalOpen(false); setVista("portafoglio"); window.scrollTo(0, 0); }}
      />

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
