function App(){
  const [appState, setAppState] = useState(DEFAULT_APP_STATE);
  const {progettiVita, progetti, activeProgettoId, capacita, opportunita, cliente, familiari} = appState;
  const activeProgetto = progetti.find(p => p.id === activeProgettoId) || progetti[0];
  const {obiettivo, tempo} = activeProgetto;

  // Ordina i progetti per priorità: risposta 3 della colonna Obiettivo
  // (importanzaObiettivo, scala 1-10). Punteggio più alto = priorità più alta.
  const progettiOrdinati = [...progetti].sort((a,b) => {
    const pa = a.obiettivo.importanzaObiettivo;
    const pb = b.obiettivo.importanzaObiettivo;
    return (pb==null ? -1 : pb) - (pa==null ? -1 : pa);
  });

  // Riferimento alla radice ".app": è l'elemento "fotografato" da
  // html2canvas per generare il PDF (vedi handlePrint più sotto).
  const appRef = useRef(null);

  const updateProgettiVita = (v) => setAppState(prev => ({...prev, progettiVita: v}));

  const updateObiettivo = (patch) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===prev.activeProgettoId ? {...p, obiettivo:{...p.obiettivo, ...patch}} : p)
  }));
  const updateTempo = (patch) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===prev.activeProgettoId ? {...p, tempo:{...p.tempo, ...patch}} : p)
  }));
  const updateCapacita = (patch) => setAppState(prev => ({...prev, capacita: {...prev.capacita, ...patch}}));
  const updateOpportunita = (patch) => setAppState(prev => ({...prev, opportunita: {...prev.opportunita, ...patch}}));
  const revealOpportunita = () => setAppState(prev => ({...prev, opportunita: {...prev.opportunita, revealed:true}}));
  const removeOpportunita = () => {
    const o = opportunita;
    const hasData = !!(o.primaCosa || o.comfort != null || o.azioneCalo || o.strumenti || o.crolloReale);
    if(hasData){
      const ok = window.confirm("Eliminare la scheda Opportunità? I dati inseriti andranno persi.");
      if(!ok) return;
    }
    setAppState(prev => ({...prev, opportunita: DEFAULT_OPPORTUNITA()}));
  };
  const updateCliente = (patch) => setAppState(prev => ({...prev, cliente: {...prev.cliente, ...patch}}));

  // ---------------- Progetti (schede sovrapposte, come pagine Excel) ----------------
  const selectProgetto = (id) => setAppState(prev => ({...prev, activeProgettoId: id}));
  const renameProgetto = (id, nome) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===id ? {...p, nome} : p)
  }));
  const addProgetto = () => {
    const newId = "progetto-" + Date.now() + "-" + Math.floor(Math.random()*1000);
    setAppState(prev => ({
      ...prev,
      progetti: [...prev.progetti, {
        id: newId,
        nome: "Obiettivo " + (prev.progetti.length + 1),
        obiettivo: DEFAULT_OBIETTIVO(),
        tempo: DEFAULT_TEMPO(),
        importi: [""]
      }],
      activeProgettoId: newId
    }));
  };
  const deleteProgetto = (id) => {
    setAppState(prev => {
      if(prev.progetti.length<=1) return prev; // mantieni sempre almeno una scheda
      const remaining = prev.progetti.filter(p => p.id!==id);
      const activeProgettoId = prev.activeProgettoId===id ? remaining[0].id : prev.activeProgettoId;
      return {...prev, progetti: remaining, activeProgettoId};
    });
  };

  // ---------------- Priorità: importi per progetto ----------------
  const addImporto = (progettoId) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===progettoId ? {...p, importi: [...(p.importi&&p.importi.length?p.importi:[""]), ""]} : p)
  }));
  const updateImporto = (progettoId, idx, value) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===progettoId ? {...p, importi: p.importi.map((v,i)=> i===idx ? value : v)} : p)
  }));
  const deleteImporto = (progettoId, idx) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===progettoId ? {...p, importi: p.importi.filter((_,i)=>i!==idx)} : p)
  }));

  const addFamiliare = () => setAppState(prev => ({
    ...prev,
    familiari: [...prev.familiari, {id: Date.now()+Math.random(), parentela:"", nome:"", cognome:"", dataNascita:"", codiceFiscale:"", residenza:""}]
  }));
  const updateFamiliare = (id, field, value) => setAppState(prev => ({
    ...prev,
    familiari: prev.familiari.map(f => f.id===id ? {...f, [field]: value} : f)
  }));
  const removeFamiliare = (id) => setAppState(prev => ({
    ...prev,
    familiari: prev.familiari.filter(f => f.id!==id)
  }));

  // ANAGRAFICA CLIENTE — modale
  const [clienteModalOpen, setClienteModalOpen] = useState(false);
  // PROFILO DI RISCHIO — modale (nessuna informazione mostrata finché non si apre)
  const [profiloModalOpen, setProfiloModalOpen] = useState(false);

  // ---------------- Blocco schede: larghezza fissa, scorrimento orizzontale ----------------
  // Le schede non si restringono mai: quando non entrano tutte (es. con
  // Opportunità aperta) si naviga spostando l'intero blocco, lasciando
  // fermo tutto il resto della pagina.
  const columnsRowRef = useRef(null);
  const [canScrollLeft, setCanScrollLeft] = useState(false);
  const [canScrollRight, setCanScrollRight] = useState(false);
  const updateColumnsNav = () => {
    const el = columnsRowRef.current;
    if(!el) return;
    setCanScrollLeft(el.scrollLeft > 4);
    setCanScrollRight(el.scrollLeft + el.clientWidth < el.scrollWidth - 4);
  };
  useEffect(() => {
    updateColumnsNav();
    window.addEventListener("resize", updateColumnsNav);
    return () => window.removeEventListener("resize", updateColumnsNav);
  }, [progetti.length, opportunita.revealed]);
  const scrollColumns = (direction) => {
    const el = columnsRowRef.current;
    if(!el) return;
    el.scrollBy({left: direction * 400, behavior: "smooth"});
  };

  // ---------------- Import / Export / Print ----------------
  const [importMsg, setImportMsg] = useState(null);
  const [pdfBusy, setPdfBusy] = useState(false);

  // Nome file suggerito in fase di esportazione: "Strategia Generali per [Cliente]"
  const buildSuggestedFilename = () => {
    const nomeCompleto = [cliente?.nome, cliente?.cognome].filter(Boolean).join(" ").trim();
    const base = nomeCompleto ? `Strategia Generali per ${nomeCompleto}` : "Strategia Generali per";
    return `${base}.json`;
  };

  const handleExport = async () => {
    const suggestedName = buildSuggestedFilename();
    const jsonString = buildExportPayload(appState);

    // 1) Chrome (desktop/Android) e altri browser con File System Access API:
    // apre la vera finestra di sistema "Salva con nome".
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName,
          types: [{ description: "File JSON", accept: {"application/json": [".json"]} }]
        });
        const writable = await handle.createWritable();
        await writable.write(jsonString);
        await writable.close();
        setImportMsg({type:"ok", text:"Esportazione completata."});
      } catch (err) {
        if (err && err.name !== "AbortError") {
          console.error("Errore durante l'esportazione:", err);
          setImportMsg({type:"err", text:"Impossibile esportare il file."});
        }
      }
      return;
    }

    // 2) iPad/iPhone (Safari) e altri browser con Web Share API: apre il foglio di
    // condivisione di sistema, dove "Salva in File" permette di scegliere la
    // cartella (e in genere anche di modificare il nome prima di salvare).
    try {
      const file = new File([jsonString], suggestedName, {type: "application/json"});
      if (navigator.canShare && navigator.canShare({files:[file]})) {
        await navigator.share({files:[file], title: suggestedName});
        setImportMsg({type:"ok", text:"Esportazione completata."});
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return; // utente ha annullato la condivisione
      console.error("Errore durante la condivisione:", err);
      // in caso di altro errore, prosegue con il fallback finale sotto
    }

    // 3) Fallback finale per browser privi delle API sopra: download diretto
    // col nome suggerito.
    const ok = exportProjectData(appState, suggestedName);
    if(ok) setImportMsg({type:"ok", text:"Esportazione completata."});
  };

  const handleImportClick = () => {
    triggerImport(setAppState, DEFAULT_APP_STATE, (msg) => setImportMsg(msg));
  };

  // Genera il PDF interamente lato client (html2canvas "fotografa" la
  // stessa identica grafica della stampa — vedi .pdf-capture nel CSS — e
  // jsPDF la impagina su più pagine A4), poi lo consegna con l'API nativa
  // di condivisione. Funziona allo stesso modo su qualsiasi dispositivo,
  // incluse le app installate su iPad/iPhone (modalità standalone), dove
  // window.print() è un limite noto di WebKit e non apre mai la stampa.
  const handlePrint = async () => {
    const el = appRef.current;
    if (!el || !window.html2canvas || !window.jspdf) {
      window.print(); // ultimo fallback, solo se le librerie non sono disponibili
      return;
    }
    setPdfBusy(true);
    el.classList.add("pdf-capture");
    // assicura che i font (Oswald/Inter) siano completamente caricati prima
    // dello screenshot, altrimenti html2canvas può "fotografare" un font
    // di fallback diverso da quello mostrato a schermo
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
    } catch (e) {}
    // lascia che il browser applichi gli stili prima dello screenshot
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    try {
      const blob = await buildPdfBlobFromElement(el);
      const filename = buildSuggestedFilename().replace(/\.json$/i, ".pdf");

      // iPad/iPhone e altri browser con Web Share API: apre il foglio di
      // condivisione di sistema (Salva in File, AirPrint, invio diretto...).
      try {
        const file = new File([blob], filename, { type: "application/pdf" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          setImportMsg({type:"ok", text:"PDF generato."});
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return; // utente ha annullato la condivisione
        console.error("Errore durante la condivisione del PDF:", err);
        // in caso di altro errore, prosegue con il download diretto sotto
      }

      // Fallback: download diretto del file.
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", filename);
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      setTimeout(() => {
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 150);
      setImportMsg({type:"ok", text:"PDF generato."});
    } catch (err) {
      console.error("Errore durante la generazione del PDF:", err);
      setImportMsg({type:"err", text:"Impossibile generare il PDF."});
    } finally {
      el.classList.remove("pdf-capture");
      setPdfBusy(false);
    }
  };

  const obiettivoSummary = () => {
    const {capitaleObiettivo, disponibilitaAttuale, importanzaObiettivo} = obiettivo;
    if(!capitaleObiettivo && !disponibilitaAttuale && importanzaObiettivo==null) return "Definiamo insieme i tuoi obiettivi e le tue priorità.";
    const parts = [];
    if(capitaleObiettivo) parts.push(`Capitale: € ${formatCurrencyDigits(capitaleObiettivo)}`);
    if(disponibilitaAttuale) parts.push(`Disponibilità: € ${formatCurrencyDigits(disponibilitaAttuale)}`);
    if(importanzaObiettivo!=null) parts.push(`Priorità: ${importanzaObiettivo}/10`);
    return parts.join(" · ");
  };

  const tempoSummary = () => {
    const anniTempo = getHorizonYears(tempo);
    const {accessoImprevisto} = tempo;
    if(anniTempo == null && !accessoImprevisto) return "Valutiamo insieme il tuo orizzonte temporale e le tue esigenze di liquidità.";
    const parts = [];
    if(anniTempo != null) parts.push(`Orizzonte: ${formatAnni(anniTempo)}`);
    if(accessoImprevisto) parts.push(`Accesso al capitale: ${accessoImprevisto}`);
    return parts.length ? parts.join(" · ") : "Valutiamo insieme il tuo orizzonte temporale e le tue esigenze di liquidità.";
  };

  const capacitaSummary = () => {
    const {quotaPatrimonio, redditoImpegnato, spesaPiu20} = capacita;
    if(!quotaPatrimonio && !redditoImpegnato && !spesaPiu20) return "Comprendiamo insieme la tua capacità di investimento.";
    const parts = [];
    if(quotaPatrimonio) parts.push(`Quota patrimonio: ${quotaPatrimonio}`);
    if(redditoImpegnato) parts.push(`Reddito già impegnato: ${redditoImpegnato}`);
    if(spesaPiu20) parts.push(`Se le spese salissero: ${spesaPiu20}`);
    return parts.length ? parts.join(" · ") : "Comprendiamo insieme la tua capacità di investimento.";
  };

  const opportunitaSummary = () => {
    const {primaCosa, comfort, strumenti} = opportunita;
    if(!primaCosa && comfort==null && !strumenti) return "Scopriamo insieme cosa cerchi davvero da un investimento.";
    const parts = [];
    if(primaCosa) parts.push(`Cerca: ${primaCosa}`);
    if(comfort!=null) parts.push(`A suo agio: ${comfort}/10`);
    if(strumenti) parts.push(`Esperienza: ${strumenti}`);
    return parts.length ? parts.join(" · ") : "Scopriamo insieme cosa cerchi davvero da un investimento.";
  };

  const ArrowSvg = () => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M9 5l7 7-7 7"/>
    </svg>
  );

  return (
    <div className="app" ref={appRef}>

      <header className="hero">
        <div className="hero-text">
          <h1>La nostra strategia, <span className="accent">costruita su di te</span></h1>
          <p className="sub">Rispondi alle domande per aiutarci a comprendere le tue esigenze e costruire insieme la <strong>soluzione più adatta</strong> ai tuoi obiettivi.</p>
        </div>
        <div className="header-actions no-print">
          <button className="profilo-icon-btn" onClick={()=>setProfiloModalOpen(true)} title="Profilo di rischio">
            <ArrowCircleIcon/>
          </button>
          <button className="cliente-badge" onClick={()=>setClienteModalOpen(true)}>
            <PersonIcon/> Cliente
          </button>
        </div>
      </header>

      <div className="life-banner">
        <p className="lb-question">Quali sono i TUOI OBIETTIVI di vita che meritano di essere finanziati oggi?</p>
        <textarea
          value={progettiVita}
          onChange={(e)=>updateProgettiVita(e.target.value)}
          placeholder="Scrivi qui la risposta..."
          rows={2}
        />
        <div className={"life-banner-static" + (progettiVita ? "" : " is-placeholder")}>
          <span>{progettiVita || "Scrivi qui la risposta..."}</span>
          <EditIcon/>
        </div>
      </div>

      <div className="progetti-row no-print">
        {progetti.map(p => (
          <ProgettoTab
            key={p.id}
            progetto={p}
            active={p.id===activeProgettoId}
            canDelete={progetti.length>1}
            onSelect={()=>selectProgetto(p.id)}
            onRename={(nome)=>renameProgetto(p.id, nome)}
            onDelete={()=>deleteProgetto(p.id)}
          />
        ))}
        <button type="button" className="cliente-badge progetto-add-btn" onClick={addProgetto} title="Aggiungi nuovo progetto">+</button>
      </div>

      <div className="columns-nav-wrap no-print">
        {canScrollLeft && (
          <button type="button" className="columns-nav-btn prev" onClick={()=>scrollColumns(-1)} title="Scorri a sinistra">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 6l-7 6 7 6"/></svg>
          </button>
        )}
        {canScrollRight && (
          <button type="button" className="columns-nav-btn next" onClick={()=>scrollColumns(1)} title="Scorri a destra">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l7 6-7 6"/></svg>
          </button>
        )}
      <div className="columns-row" ref={columnsRowRef} onScroll={updateColumnsNav}>

        {/* ---------------- OBIETTIVO (cambia ad ogni progetto) ---------------- */}
        <div className="card">
          <div className="circle">1</div>
          <div className="card-header red">
            <h2>OBIETTIVO</h2>
          </div>
          <div className="card-body">
            <Question icon={<CoinIcon/>} number="1" text="Quanto capitale immagini possa servire per realizzare il tuo obiettivo?">
              <CurrencyInput
                value={obiettivo.capitaleObiettivo}
                onChange={(v)=>updateObiettivo({capitaleObiettivo:v})}
                autoFocus
              />
            </Question>

            <Question icon={<WalletIcon/>} number="2" text="Qual'è la disponibilità attuale per realizzare le fondamenta di questo obiettivo?">
              <CurrencyInput value={obiettivo.disponibilitaAttuale} onChange={(v)=>updateObiettivo({disponibilitaAttuale:v})}/>
            </Question>

            {obiettivo.disponibilitaAttuale !== "" && (
              <Question className="reveal" icon={<WalletIcon/>} number="2.1" text={currencyDigitsToNumber(obiettivo.disponibilitaAttuale) === 0
                  ? "Quale importo mensile vuole destinare alla realizzazione di questo obiettivo:"
                  : "Per raggiungere serenamente l'obiettivo quanto è disposto ad accumulare mensilmente?"}>
                <CurrencyInput value={obiettivo.integrazioneMensile} onChange={(v)=>updateObiettivo({integrazioneMensile:v})}/>
              </Question>
            )}

            <Question icon={<StarIcon/>} number="3" text="Quanto è importante raggiungere questo obiettivo per te?">
              <ScaleQuestion value={obiettivo.importanzaObiettivo} onChange={(v)=>updateObiettivo({importanzaObiettivo:v})}/>
            </Question>

            <Question icon={<TrophyIcon/>} number="4" text="Quale frase descrive meglio ciò che vorresti ottenere da questo investimento?">
              <ChoiceQuestion
                options={["Arrivare al risultato con certezza","Arrivare al risultato con buona probabilità","Arrivare più in alto possibile, fiducioso del mercato"]}
                value={obiettivo.risultatoAtteso}
                onChange={(v)=>updateObiettivo({risultatoAtteso:v})}
              />
            </Question>

            <div style={{flex:1}}/>
            <PromiseBox icon={<PersonIcon/>} text={obiettivoSummary()}/>
          </div>
        </div>

        <div className="arrow-wrap"><ArrowSvg/></div>

        {/* ---------------- TEMPO (cambia ad ogni progetto) ---------------- */}
        <div className="card dark">
          <div className="circle">2</div>
          <div className="card-header dark">
            <h2>TEMPO</h2>
          </div>
          <div className="card-body">
            <Question icon={<HourglassIcon/>} number="1" text="Tra quanti anni vorresti vedere il tuo progetto realizzarsi?">
              <TimeSlider
                anni={getHorizonYears(tempo)}
                onChange={(v)=>updateTempo({orizzonteAnni:v})}
              />
            </Question>
            <Question icon={<WalletIcon/>} number="2" text="Se si verificasse un imprevisto personale, quanto sarebbe importante poter accedere al capitale investito?">
              <ChoiceQuestion
                options={["Importante, per ogni imprevisto","Necessario, solo in caso di Salute","Trascurabile, ho un cuscinetto separato"]}
                value={tempo.accessoImprevisto}
                onChange={(v)=>updateTempo({accessoImprevisto:v})}
              />
            </Question>
            <Question icon={<PieIcon/>} number="3" text="Ci sono stati episodi in passato che hanno influenzato la gestione dei tuoi investimenti?">
              <LineInput value={tempo.esperienze} onChange={(v)=>updateTempo({esperienze:v})}/>
            </Question>
            <Question icon={<ShieldPctIcon/>} number="4" text="Se per raggiungere il tuo obiettivo servisse maggior tempo:">
              <ChoiceQuestion
                options={["Liquiderei, non potendo attendere","Potrei rinviare di 1-2 anni","Potrei rinviare per oltre 3 anni"]}
                value={tempo.maggiorTempo}
                onChange={(v)=>updateTempo({maggiorTempo:v})}
              />
            </Question>
            <div style={{flex:1}}/>
            <PromiseBox icon={<CalendarIcon/>} text={tempoSummary()}/>
          </div>
        </div>

        <div className="arrow-wrap"><ArrowSvg/></div>

        {/* ---------------- CAPACITÀ (condivisa fra tutti i progetti) ---------------- */}
        <div className="card" style={{position:"relative"}}>
          <div className="circle">3</div>
          <div className="card-header red">
            <h2>CAPACITÀ</h2>
          </div>
          <div className="card-body">
            <Question icon={<PieIcon/>} number="1" text="Quanto rappresenta questo investimento sul totale del tuo patrimonio?">
              <ChoiceQuestion
                options={["Meno del 25%","Tra il 25% e il 50%","Tra il 50% e il 75%","Oltre il 75%"]}
                value={capacita.quotaPatrimonio}
                onChange={(v)=>updateCapacita({quotaPatrimonio:v})}
              />
            </Question>
            <Question icon={<WalletIcon/>} number="2" text="Che parte del reddito mensile netto è già impegnata in rate, mutuo, affitto o altri impegni fissi?">
              <ChoiceQuestion
                options={["10% - 20%","20% - 35%","35% - 50%","Oltre il 50%"]}
                value={capacita.redditoImpegnato}
                onChange={(v)=>updateCapacita({redditoImpegnato:v})}
              />
            </Question>
            <Question icon={<ShieldPctIcon/>} number="3" text="Se le spese aumentassero del 20%, come cambierebbe la sua situazione?">
              <ChoiceQuestion
                options={["Non cambierebbe molto","Dovrei fare delle rinunce","Dovrei tagliare spese importanti","Andrei in difficoltà"]}
                value={capacita.spesaPiu20}
                onChange={(v)=>updateCapacita({spesaPiu20:v})}
              />
            </Question>
            <Question icon={<TargetIcon/>} number="4" text="Quant'è importante per te mantenere una liquidità sul conto?">
              <div className="option-grid">
                <div className="inline-currency-option">
                  <label
                    className={"option" + (capacita.liquiditaImportanza==="Assolutamente" ? " selected" : "")}
                    onClick={()=>updateCapacita({liquiditaImportanza: capacita.liquiditaImportanza==="Assolutamente" ? null : "Assolutamente"})}
                  >
                    <span className="checkbox"><CheckIcon/></span>
                    Assolutamente, almeno
                  </label>
                  {capacita.liquiditaImportanza==="Assolutamente" && (
                    <CurrencyInput value={capacita.liquiditaImportoAssoluto} onChange={(v)=>updateCapacita({liquiditaImportoAssoluto:v})}/>
                  )}
                </div>
                <div className="inline-currency-option">
                  <label
                    className={"option" + (capacita.liquiditaImportanza==="Relativo" ? " selected" : "")}
                    onClick={()=>updateCapacita({liquiditaImportanza: capacita.liquiditaImportanza==="Relativo" ? null : "Relativo"})}
                  >
                    <span className="checkbox"><CheckIcon/></span>
                    Relativo, almeno
                  </label>
                  {capacita.liquiditaImportanza==="Relativo" && (
                    <CurrencyInput value={capacita.liquiditaImportoRelativo} onChange={(v)=>updateCapacita({liquiditaImportoRelativo:v})}/>
                  )}
                </div>
                <label
                  className={"option" + (capacita.liquiditaImportanza==="Non necessario" ? " selected" : "")}
                  onClick={()=>updateCapacita({liquiditaImportanza: capacita.liquiditaImportanza==="Non necessario" ? null : "Non necessario"})}
                >
                  <span className="checkbox"><CheckIcon/></span>
                  Non necessario
                </label>
              </div>
            </Question>
            <div style={{flex:1}}/>
            <PromiseBox icon={<ShieldHeartIcon/>} text={capacitaSummary()}/>
          </div>
        </div>

        {opportunita.revealed ? (
          <div className="arrow-wrap"><ArrowSvg/></div>
        ) : (
          <div className="opportunita-adder no-print">
            <button type="button" className="opportunita-plus" onClick={revealOpportunita} title="Aggiungi scheda Opportunità">+</button>
          </div>
        )}

        {/* ---------------- OPPORTUNITÀ (condivisa fra tutti i progetti) ---------------- */}
        {opportunita.revealed && (
          <div className="card dark">
            <div className="circle">4</div>
            <div className="card-header dark">
              <h2>OPPORTUNITÀ</h2>
              <button
                type="button"
                className="card-header-delete no-print"
                onClick={removeOpportunita}
                title="Elimina scheda Opportunità"
              >×</button>
            </div>
            <div className="card-body">
              <Question icon={<SmileyIcon/>} number="1" text="Cosa cerchi prima di tutto in un investimento?">
                <ChoiceQuestion
                  options={["Tranquillità (capitale stabile)","Efficienza (battere l'inflazione)","Crescita (massimo rendimento)"]}
                  value={opportunita.primaCosa}
                  onChange={(v)=>updateOpportunita({primaCosa:v})}
                />
              </Question>
              <Question icon={<TrendIcon/>} number="2" text="Quanto si sente a suo agio con la variabilità dei mercati?">
                <ScaleQuestion value={opportunita.comfort} onChange={(v)=>updateOpportunita({comfort:v})}/>
              </Question>
              <Question icon={<ShieldPctIcon/>} number="3" text="Se il mercato scendesse temporaneamente del 10% cosa faresti?">
                <ChoiceQuestion
                  options={["Riscatto l'intero importo","Provo a non pensarci sperando che il mercato risalga","Attendo con serenità","Approfitto del momento con un nuovo versamento"]}
                  value={opportunita.azioneCalo}
                  onChange={(v)=>updateOpportunita({azioneCalo:v})}
                />
              </Question>
              <Question icon={<PieIcon/>} number="4" text="Quali di questi strumenti ha detenuto negli ultimi 10 anni?">
                <ChoiceQuestion
                  options={["Conto, deposito","Gestione separata, BTP, Obbligazioni","Polizze unit-linked, Fondi bilanciati","Azioni, ETF","Strumenti complessi, criptovalute"]}
                  value={opportunita.strumenti}
                  onChange={(v)=>updateOpportunita({strumenti:v})}
                />
              </Question>
              {STRUMENTI_RISCHIOSI.includes(opportunita.strumenti) && (
                <Question className="reveal" icon={<ShieldPctIcon/>} number="4.1" text="Cosa hai fatto realmente nei forti cali di mercato del 2020 o del 2022?">
                  <ChoiceQuestion
                    options={["Ho venduto tutto o quasi","Ho venduto una parte","Ho mantenuto la posizione","Ho investito di più approfittando dei prezzi bassi"]}
                    value={opportunita.crolloReale}
                    onChange={(v)=>updateOpportunita({crolloReale:v})}
                  />
                </Question>
              )}
              <div style={{flex:1}}/>
              <PromiseBox icon={<TrendIcon/>} text={opportunitaSummary()}/>
            </div>
          </div>
        )}

      </div>
      </div>

      <div className="print-only print-schede">
        {progetti.map(p => {
          return (
          <div className="print-progetto" key={p.id}>
            <h2 className="print-progetto-title">{p.nome}</h2>
            <table className="print-table">
              <tbody>
                <tr className="print-section-row"><td colSpan="2">OBIETTIVO</td></tr>
                <tr>
                  <td>1. Quanto capitale immagini possa servire per realizzare il tuo obiettivo?</td>
                  <td>{p.obiettivo.capitaleObiettivo ? `€ ${formatCurrencyDigits(p.obiettivo.capitaleObiettivo)}` : "—"}</td>
                </tr>
                <tr>
                  <td>2. Qual'è la disponibilità attuale per realizzare le fondamenta di questo obiettivo?</td>
                  <td>{p.obiettivo.disponibilitaAttuale ? `€ ${formatCurrencyDigits(p.obiettivo.disponibilitaAttuale)}` : "—"}</td>
                </tr>
                <tr>
                  <td>2.1. Versamento/accumulo mensile per l'obiettivo</td>
                  <td>{p.obiettivo.integrazioneMensile ? `€ ${formatCurrencyDigits(p.obiettivo.integrazioneMensile)}` : "—"}</td>
                </tr>
                <tr>
                  <td>3. Quanto è importante raggiungere questo obiettivo per te?</td>
                  <td>{p.obiettivo.importanzaObiettivo!=null ? `${p.obiettivo.importanzaObiettivo}/10` : "—"}</td>
                </tr>
                <tr>
                  <td>4. Cosa vorresti ottenere da questo investimento?</td>
                  <td>{p.obiettivo.risultatoAtteso || "—"}</td>
                </tr>

                <tr className="print-section-row"><td colSpan="2">TEMPO</td></tr>
                <tr>
                  <td>1. Tra quanti anni vorresti vedere il tuo progetto realizzarsi?</td>
                  <td>{getHorizonYears(p.tempo) != null ? formatAnni(getHorizonYears(p.tempo)) : "—"}</td>
                </tr>
                <tr>
                  <td>2. Se si verificasse un imprevisto personale, quanto sarebbe importante poter accedere al capitale investito?</td>
                  <td>{p.tempo.accessoImprevisto || "—"}</td>
                </tr>
                <tr>
                  <td>3. Ci sono stati episodi in passato che hanno influenzato la gestione dei tuoi investimenti?</td>
                  <td>{p.tempo.esperienze || "—"}</td>
                </tr>
                <tr>
                  <td>4. Se servisse maggior tempo per raggiungere l'obiettivo</td>
                  <td>{p.tempo.maggiorTempo || "—"}</td>
                </tr>

                <tr className="print-section-row"><td colSpan="2">CAPACITÀ</td></tr>
                <tr>
                  <td>1. Quanto rappresenta questo investimento sul totale del tuo patrimonio?</td>
                  <td>{capacita.quotaPatrimonio || "—"}</td>
                </tr>
                <tr>
                  <td>2. Quota di reddito mensile netto già impegnata in rate/mutuo/affitto</td>
                  <td>{capacita.redditoImpegnato || "—"}</td>
                </tr>
                <tr>
                  <td>3. Se le spese aumentassero del 20%</td>
                  <td>{capacita.spesaPiu20 || "—"}</td>
                </tr>
                <tr>
                  <td>4. Importanza di mantenere liquidità sul conto</td>
                  <td>
                    {capacita.liquiditaImportanza || "—"}
                    {capacita.liquiditaImportanza==="Assolutamente" && capacita.liquiditaImportoAssoluto ? ` (€ ${formatCurrencyDigits(capacita.liquiditaImportoAssoluto)})` : ""}
                    {capacita.liquiditaImportanza==="Relativo" && capacita.liquiditaImportoRelativo ? ` (€ ${formatCurrencyDigits(capacita.liquiditaImportoRelativo)})` : ""}
                  </td>
                </tr>

                {opportunita.revealed && (
                  <React.Fragment>
                    <tr className="print-section-row"><td colSpan="2">OPPORTUNITÀ (TOLLERANZA)</td></tr>
                    <tr>
                      <td>1. Cosa cerchi prima di tutto in un investimento?</td>
                      <td>{opportunita.primaCosa || "—"}</td>
                    </tr>
                    <tr>
                      <td>2. A suo agio con la variabilità dei mercati</td>
                      <td>{opportunita.comfort!=null ? `${opportunita.comfort}/10` : "—"}</td>
                    </tr>
                    <tr>
                      <td>3. Se il mercato scendesse temporaneamente del 10%</td>
                      <td>{opportunita.azioneCalo || "—"}</td>
                    </tr>
                    <tr>
                      <td>4. Strumenti detenuti negli ultimi 10 anni</td>
                      <td>{opportunita.strumenti || "—"}</td>
                    </tr>
                    {STRUMENTI_RISCHIOSI.includes(opportunita.strumenti) && (
                      <tr>
                        <td>4.1. Reazione reale ai crolli 2020/2022</td>
                        <td>{opportunita.crolloReale || "—"}</td>
                      </tr>
                    )}
                  </React.Fragment>
                )}
              </tbody>
            </table>
          </div>
          );
        })}
      </div>

      <div className="priority-banner">
        <div className="pb-header">
          <div className="pb-side pb-side-ghost"></div>
          <div className="pb-header-text">
            <p className="pb-title">Progetto Strategia Generali</p>
            <p className="pb-subtitle">Quanto è disposto a destinare oggi a questo progetto?</p>
          </div>
        </div>
        <div className="pb-body">
          <div className="pb-side"><span>Priorità</span></div>
          <div className="pb-content">
            <div className="priority-list">
              {progettiOrdinati.map(p => (
                <div className="priority-row" key={p.id}>
                  <span className="priority-badge">{p.nome}</span>
                  {(p.importi && p.importi.length ? p.importi : [""]).map((val, idx) => (
                    <div className="priority-importo-wrap" key={idx}>
                      <input
                        type="text"
                        className="priority-importo-input"
                        placeholder="Importo"
                        value={val}
                        onChange={(e)=>updateImporto(p.id, idx, e.target.value)}
                      />
                      <span className={"priority-importo-static" + (val ? "" : " is-placeholder")}>
                        {val || "Importo"}
                      </span>
                      <button
                        type="button"
                        className="priority-importo-x no-print"
                        onClick={()=>deleteImporto(p.id, idx)}
                        title="Rimuovi questo importo"
                      >×</button>
                    </div>
                  ))}
                  <button
                    type="button"
                    className="priority-add-importo no-print"
                    onClick={()=>addImporto(p.id)}
                    title="Aggiungi un altro importo"
                  >+</button>
                </div>
              ))}
            </div>
          </div>
          <div className="pb-tagline"><p>&ldquo;Diamo VALORE ai tuo OBIETTIVI.&rdquo;</p></div>
        </div>
      </div>

      <div className="promise-bar">
        <div className="promise-item">
          <div className="pi-icon"><PersonIcon/></div>
          <div>
            <h3>LA NOSTRA PROMESSA</h3>
            <p>Ti affianchiamo con competenza, trasparenza e ascolto per aiutarti a prendere decisioni consapevoli.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><PeopleIcon/></div>
          <div>
            <h3>ASCOLTO</h3>
            <p>Capiamo le tue esigenze per conoscerti veramente.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><SearchIcon/></div>
          <div>
            <h3>ANALISI</h3>
            <p>Valutiamo insieme tutte le variabili che contano.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><CompassIcon/></div>
          <div>
            <h3>PIANIFICAZIONE</h3>
            <p>Costruiamo un piano su misura per i tuoi obiettivi.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><ChartUpIcon/></div>
          <div>
            <h3>MONITORAGGIO</h3>
            <p>Ti accompagniamo nel tempo, adattando la strategia con te.</p>
          </div>
        </div>

        <div className="quote">
          <span className="mark">&ldquo;</span>
          <span>Il miglior investimento è quello che ti porta verso il <strong>futuro che desideri</strong>.</span>
          <span className="mark">&rdquo;</span>
        </div>
      </div>

      <div className="toolbar no-print">
        <button className="tb-btn" onClick={handlePrint} disabled={pdfBusy}>
          <PrintIcon/> {pdfBusy ? "Generazione PDF…" : "Stampa / Export PDF"}
        </button>
        <button className="tb-btn" onClick={handleImportClick}><UploadIcon/> Importa Progetto</button>
        <button className="tb-btn primary" onClick={handleExport}><DownloadIcon/> Esporta Progetto</button>
      </div>
      {importMsg && <p className={"import-msg no-print " + importMsg.type}>{importMsg.text}</p>}

      <ClienteModal
        open={clienteModalOpen}
        onClose={()=>setClienteModalOpen(false)}
        cliente={cliente}
        updateCliente={updateCliente}
        familiari={familiari}
        addFamiliare={addFamiliare}
        updateFamiliare={updateFamiliare}
        removeFamiliare={removeFamiliare}
      />

      <ProfiloModal
        open={profiloModalOpen}
        onClose={()=>setProfiloModalOpen(false)}
        progetti={progetti}
        activeProgettoId={activeProgettoId}
        capacita={capacita}
        opportunita={opportunita}
      />

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
