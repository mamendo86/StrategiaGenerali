<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>La nostra strategia, costruita su di te — Generali</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#C8102E">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strategia Cliente">
<link rel="icon" href="./icon-192.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<style>
  :root{
    --red:#C8102E;
    --red-dark:#A00E26;
    --red-tint:#FBE9EA;
    --red-tint-border:#F2C9CC;
    --charcoal:#3A3A3A;
    --charcoal-dark:#242424;
    --ink:#1C1C1C;
    --grey:#6B6558;
    --grey-light:#8f8a7d;
    --line:#E4E0D8;
    --paper:#FFFFFF;
    --bg:#F4F2EE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1240px;margin:0 auto;padding:28px 22px 60px;}

  /* ---------- HERO ---------- */
  .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
  .hero h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(28px,4.2vw,46px);
    letter-spacing:0.01em;
    margin:0 0 16px;
    color:var(--ink);
    text-transform:uppercase;
    line-height:1.05;
  }
  .hero h1 .accent{color:var(--red);position:relative;display:inline-block;padding-bottom:6px;}
  .hero h1 .accent::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--red);
    transform:scaleX(0);transform-origin:left;animation:growLine 0.9s 0.3s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes growLine{to{transform:scaleX(1);}}
  .hero p.sub{margin:0;color:var(--grey);font-size:15px;max-width:620px;line-height:1.55;}
  .hero p.sub strong{color:var(--red);font-weight:700;}

  .cliente-badge{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
    background:var(--paper);border:1.6px solid var(--red);color:var(--red);
    font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.04em;font-size:14px;
    padding:10px 18px;border-radius:24px;cursor:pointer;transition:all 0.18s;
  }
  .cliente-badge svg{width:18px;height:18px;}
  .cliente-badge:hover{background:var(--red);color:#fff;transform:translateY(-1px);box-shadow:0 4px 10px rgba(200,16,46,0.25);}

  /* ---------- BANNER PROGETTI DI VITA ---------- */
  .life-banner{
    width:100%;background:var(--red);color:#fff;border-radius:6px;
    padding:20px 24px 22px;margin:0 0 22px;box-sizing:border-box;
  }
  .life-banner .lb-question{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;letter-spacing:0.01em;
    margin:0 0 12px;line-height:1.35;color:#fff;
  }
  .life-banner textarea{
    width:100%;min-height:54px;border:none;border-bottom:1.5px solid rgba(255,255,255,0.55);
    border-radius:0;background:var(--red);color:#fff;
    font-family:'Inter',sans-serif;font-size:13.5px;padding:10px 2px;resize:vertical;
    line-height:1.5;box-sizing:border-box;
  }
  .life-banner textarea:focus{outline:none;border-bottom-color:#fff;}
  .life-banner textarea::placeholder{color:rgba(255,255,255,0.75);}

  /* ---------- BANNER PRIORITÀ ---------- */
  .priority-banner{
    width:100%;background:var(--red);color:#fff;border-radius:6px;
    margin:34px 0 0;box-sizing:border-box;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .pb-header{display:flex;align-items:flex-start;gap:18px;padding:22px 24px 2px 16px;}
  .priority-banner .pb-title{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.02em;
    margin:0 0 4px;text-align:left;color:#fff;
  }
  .priority-banner .pb-subtitle{
    font-family:'Inter',sans-serif;font-size:14px;margin:0;text-align:left;
    color:rgba(255,255,255,0.9);
  }
  .pb-header-text{flex:1 1 auto;min-width:0;}
  .pb-body{display:flex;align-items:stretch;gap:18px;padding:0 0 0 16px;}
  .pb-side{
    flex:0 0 40px;width:40px;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;
    padding:14px 0 20px;
  }
  .pb-side span{
    writing-mode:vertical-rl;transform:rotate(180deg);
    font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:0.14em;
    color:#fff;white-space:nowrap;
  }
  .pb-content{flex:3 1 0;min-width:0;padding:14px 24px 24px 0;}
  .pb-tagline{
    flex:1 1 0;min-width:150px;display:flex;align-items:center;justify-content:center;
    padding:14px 24px 24px 8px;text-align:center;
  }
  .pb-tagline p{
    margin:0;max-width:220px;font-family:'Oswald',sans-serif;font-weight:600;font-style:italic;
    font-size:15px;line-height:1.4;text-align:center;color:#fff;
  }
  .priority-list{display:flex;flex-direction:column;gap:12px;}
  .priority-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .priority-badge{
    flex:0 0 150px;width:150px;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;
    background:#fff;color:var(--red);font-family:'Oswald',sans-serif;font-weight:600;
    letter-spacing:0.03em;font-size:14px;padding:9px 14px;border-radius:24px;white-space:nowrap;
    text-align:center;
  }
  .priority-importo-wrap{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;}
  .priority-importo-input{
    width:130px;background:#fff;color:var(--ink);border:none;border-radius:24px;
    padding:9px 30px 9px 16px;font-family:'Inter',sans-serif;font-size:13.5px;box-sizing:border-box;
  }
  .priority-importo-input:focus{outline:2px solid rgba(255,255,255,0.7);}
  .priority-importo-input::placeholder{color:#B7B2A5;}
  .priority-importo-x{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,0.12);
    color:var(--red);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }
  .priority-importo-x:hover{background:rgba(0,0,0,0.22);}
  .priority-add-importo{
    flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,0.25);
    color:#fff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background 0.15s;
  }
  .priority-add-importo:hover{background:rgba(255,255,255,0.4);}

  /* ---------- PROGETTI TABS ---------- */
  .progetti-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .progetto-tab{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
    background:var(--paper);border:1.6px solid var(--red);color:var(--red);
    font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.04em;font-size:14px;
    padding:9px 9px 9px 18px;border-radius:24px;cursor:pointer;transition:all 0.18s;white-space:nowrap;
  }
  .progetto-tab:hover{background:var(--red);color:#fff;transform:translateY(-1px);box-shadow:0 4px 10px rgba(200,16,46,0.25);}
  .progetto-tab.active{background:var(--red);color:#fff;box-shadow:0 4px 10px rgba(200,16,46,0.25);}
  .progetto-tab-label{pointer-events:none;}
  .progetto-tab-edit{
    border:none;background:rgba(0,0,0,0.08);color:inherit;border-radius:50%;
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex:0 0 24px;padding:0;transition:background 0.15s;
  }
  .progetto-tab-edit svg{width:12px;height:12px;}
  .progetto-tab.active .progetto-tab-edit,
  .progetto-tab:hover .progetto-tab-edit{background:rgba(255,255,255,0.3);}
  .progetto-tab-input{
    font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.04em;font-size:14px;
    padding:10px 18px;border-radius:24px;border:1.6px solid var(--red);color:var(--red);
    background:#fff;min-width:110px;
  }
  .progetto-tab-input:focus{outline:none;}
  .progetto-tab-editing{display:flex;align-items:center;gap:6px;}
  .progetto-tab-delete{
    flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1.6px solid var(--red);
    background:#fff;color:var(--red);font-size:16px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all 0.15s;
  }
  .progetto-tab-delete:hover{background:var(--red);color:#fff;}
  .progetto-add-btn{
    width:40px;height:40px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;line-height:1;flex:0 0 auto;
  }

  /* ---------- COLUMNS ---------- */
  .columns-row{display:flex;align-items:stretch;gap:0;margin-top:46px;position:relative;}
  .arrow-wrap{display:flex;align-items:center;justify-content:center;flex:0 0 46px;margin-top:70px;}
  .arrow-wrap svg{width:34px;height:34px;color:#C9C4B8;}
  .card{
    flex:1 1 0;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    position:relative;
    display:flex;flex-direction:column;
    opacity:0;
    animation:cardIn 0.6s ease forwards;
    box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  .card:nth-child(1){animation-delay:0.05s;}
  .card:nth-child(3){animation-delay:0.2s;}
  .card:nth-child(5){animation-delay:0.35s;}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .circle{
    position:absolute;top:-24px;left:50%;transform:translateX(-50%);
    width:48px;height:48px;border-radius:50%;
    background:var(--red);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;
    border:4px solid var(--bg);
    z-index:2;
  }
  .card.dark .circle{background:var(--charcoal);}

  .card-header{
    margin-top:26px;border-radius:8px 8px 0 0;padding:20px 18px;
    text-align:center;color:#fff;
  }
  .card-header.red{background:linear-gradient(180deg,var(--red) 0%,var(--red-dark) 100%);}
  .card-header.dark{background:linear-gradient(180deg,var(--charcoal) 0%,var(--charcoal-dark) 100%);}
  .card-header h2{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;letter-spacing:0.05em;margin:0;text-align:center;}

  .card-body{padding:20px 20px 18px;display:flex;flex-direction:column;flex:1;}

  .question{display:flex;gap:12px;padding:14px 0;}
  .question:first-child{padding-top:2px;}
  .q-icon{flex:0 0 26px;color:var(--red);margin-top:2px;}
  .card.dark .q-icon{color:var(--charcoal);}
  .q-icon svg{width:24px;height:24px;}
  .q-content{flex:1;min-width:0;}
  .q-text{margin:0 0 8px;font-size:13.5px;line-height:1.45;color:var(--ink);}
  .q-text b{font-weight:700;}
  .divider{border:none;border-top:1px solid var(--line);margin:0;}

  .reveal{animation:revealIn 0.45s cubic-bezier(.2,.8,.2,1);}
  @keyframes revealIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

  .line-input{
    width:100%;border:none;border-bottom:1.5px solid var(--line);
    background:transparent;font-family:inherit;font-size:13.5px;color:var(--ink);
    padding:4px 2px 6px;resize:none;overflow:hidden;line-height:1.4;transition:border-color 0.2s;
  }
  .line-input:focus{outline:none;border-bottom-color:var(--red);}
  .card.dark .line-input:focus{border-bottom-color:var(--charcoal);}
  .line-input::placeholder{color:#B7B2A5;}
  .hint{font-size:11px;color:#B7B2A5;margin-top:3px;}

  .option-grid{display:flex;flex-direction:column;gap:8px;margin-top:2px;}
  .option-grid.two-col{flex-direction:row;flex-wrap:wrap;gap:8px 22px;}
  .option{
    display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--ink);
    padding:3px 2px;border-radius:4px;transition:background 0.15s;
  }
  .option:hover{background:#FAF8F4;}
  .checkbox{
    width:16px;height:16px;border:1.6px solid #C9C4B8;border-radius:3px;flex:0 0 16px;
    display:flex;align-items:center;justify-content:center;transition:all 0.18s;
  }
  .option.selected .checkbox{background:var(--red);border-color:var(--red);}
  .checkbox svg{width:11px;height:11px;color:#fff;opacity:0;transform:scale(0.5);transition:all 0.15s;}
  .option.selected .checkbox svg{opacity:1;transform:scale(1);}

  .scale-row{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;}
  .scale-btn{
    width:28px;height:28px;border-radius:6px;border:1.4px solid var(--line);background:var(--paper);
    font-size:12.5px;font-weight:600;color:var(--grey);cursor:pointer;transition:all 0.15s;
    font-variant-numeric:tabular-nums;
  }
  .scale-btn:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px);}
  .scale-btn.active{background:var(--red);border-color:var(--red);color:#fff;transform:scale(1.08);}

  /* ---------- TIME SLIDER ---------- */
  .slider-wrap.timeline-slider{
    position:relative;padding:6px 10px 4px;margin-top:10px;
    touch-action:pan-x; /* impedisce allo scroll verticale di scattare durante il drag orizzontale */
  }
  .time-track-wrap{position:relative;height:32px;}
  .time-track-line{
    position:absolute;left:0;right:0;top:50%;height:4px;border-radius:3px;
    background:var(--line);transform:translateY(-50%);
  }
  .time-track-fill{
    position:absolute;left:0;top:50%;height:4px;border-radius:3px;
    background:var(--red);transform:translateY(-50%);transition:width 0.2s ease;z-index:1;
  }
  .time-track-nodes{
    position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;z-index:2;
    pointer-events:none;
  }
  .node-dot{
    width:8px;height:8px;border-radius:50%;background:var(--line);
    transition:background 0.2s, transform 0.2s;
  }
  .node-dot.active{background:var(--red);transform:scale(1.15);}
  .time-thumb-ring{
    position:absolute;top:50%;width:22px;height:22px;border-radius:50%;
    border:3px solid var(--red);background:#fff;transform:translate(-50%,-50%);
    transition:left 0.2s ease;z-index:3;pointer-events:none;
  }
  .timeline-slider input[type="range"].time-slider{
    -webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:100%;
    margin:0;background:transparent;outline:none;cursor:pointer;z-index:4;opacity:0;
    touch-action:pan-x;
  }
  .time-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;opacity:0;}
  .time-slider::-moz-range-thumb{width:22px;height:22px;opacity:0;border:none;}
  .time-slider::-moz-range-track{background:transparent;}
  .time-labels{display:flex;justify-content:space-between;margin-top:12px;gap:4px;}
  .time-label{
    flex:1 1 0;font-size:10px;color:var(--grey-light);line-height:1.3;transition:color 0.2s;
  }
  .time-label:first-child{text-align:left;}
  .time-label:last-child{text-align:right;}
  .time-label:not(:first-child):not(:last-child){text-align:center;}
  .time-label.active{color:var(--red);font-weight:700;}

  .promise-box{
    margin-top:16px;background:var(--red-tint);border:1px solid var(--red-tint-border);border-radius:6px;
    padding:12px 14px;display:flex;gap:10px;align-items:flex-start;
  }
  .promise-box .p-icon{flex:0 0 22px;color:var(--red);margin-top:1px;}
  .promise-box .p-icon svg{width:20px;height:20px;}
  .promise-box p{margin:0;font-size:12.5px;font-weight:600;color:var(--red-dark);line-height:1.4;
    animation:fadeSwap 0.4s ease;}
  @keyframes fadeSwap{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- PROMISE BAR ---------- */
  .promise-bar{
    margin-top:34px;border:1px solid var(--line);border-radius:10px;background:var(--paper);
    display:flex;flex-wrap:wrap;padding:22px 10px;
    page-break-inside:avoid;break-inside:avoid;
  }
  .promise-item{flex:1 1 190px;display:flex;gap:12px;padding:8px 14px;}
  .promise-item .pi-icon{flex:0 0 30px;color:var(--red);}
  .promise-item .pi-icon svg{width:28px;height:28px;}
  .promise-item h3{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.03em;margin:0 0 4px;color:var(--ink);}
  .promise-item p{margin:0;font-size:12px;color:var(--grey);line-height:1.4;}

  /* ---------- QUOTE ---------- */
  .quote{
    flex:1 1 100%;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);
    text-align:center;font-size:16px;color:var(--ink);font-style:italic;
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  }
  .quote .mark{color:var(--red);font-size:34px;font-style:normal;font-family:Georgia,serif;line-height:0;position:relative;top:8px;}
  .quote strong{font-style:normal;color:var(--red);font-weight:700;}

  /* ---------- TOOLBAR ---------- */
  .toolbar{display:flex;justify-content:flex-end;gap:10px;margin-top:26px;flex-wrap:wrap;}
  .tb-btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:22px;
    border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);
    cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif;
  }
  .tb-btn svg{width:15px;height:15px;}
  .tb-btn:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px);}
  .tb-btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
  .tb-btn.primary:hover{background:var(--red-dark);color:#fff;}
  .import-msg{font-size:12px;margin-top:8px;text-align:right;color:var(--grey);}
  .import-msg.ok{color:#2f8a4b;}
  .import-msg.error{color:var(--red);}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,20,20,0.55);display:flex;align-items:center;
    justify-content:center;z-index:60;padding:20px;animation:overlayIn 0.2s ease;
  }
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:86vh;overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,0.3);animation:modalIn 0.28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal-header{
    display:flex;justify-content:space-between;align-items:center;padding:18px 22px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:12px 12px 0 0;
  }
  .modal-header h2{font-family:'Oswald',sans-serif;font-size:19px;margin:0;color:var(--ink);}
  .modal-close{border:none;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--grey);padding:2px 6px;}
  .modal-close:hover{color:var(--red);}
  .modal-body{padding:22px;}
  .modal-section{margin-bottom:24px;}
  .modal-section:last-child{margin-bottom:0;}
  .modal-section h3{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.04em;color:var(--red);margin:0 0 14px;text-transform:uppercase;}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .modal-grid label{display:flex;flex-direction:column;font-size:12px;color:var(--grey);gap:6px;font-weight:600;}
  .modal-grid input, .familiare-card input, .modal-grid select, .familiare-card select{
    border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px;
    font-family:inherit;color:var(--ink);transition:border-color 0.15s;width:100%;background:#fff;
  }
  .modal-grid input:focus, .familiare-card input:focus, .familiare-card select:focus{outline:none;border-color:var(--red);}

/* =========================================================================

/* ---------------- Auto-growing textarea used as an "answer line" ---------------- */
function LineInput({value, onChange, placeholder, onEnter, autoFocus}){
  const ref = useRef(null);
  useEffect(()=>{
    if(ref.current){
      ref.current.style.height = "auto";
      ref.current.style.height = ref.current.scrollHeight + "px";
    }
  }, [value]);
  useEffect(()=>{
    if(autoFocus && ref.current) ref.current.focus();
  }, [autoFocus]);
  return (
    <textarea
      ref={ref}
      className="line-input"
      rows={1}
      placeholder={placeholder || "Scrivi qui la tua risposta..."}
      value={value}
      onChange={(e)=>onChange(e.target.value)}
      onKeyDown={(e)=>{
        if(onEnter && e.key === "Enter" && !e.shiftKey){
          e.preventDefault();
          onEnter();
        }
      }}
    />
  );
}

function ChoiceQuestion({options, value, onChange, columns}){

    <div className={"option-grid" + (columns ? " two-col" : "")}>

          onClick={()=>onChange(value===opt ? null : opt)}
        >

          {opt}
        </label>

  );
}

function ScaleQuestion({value, onChange}){

}

/* Slider temporale — nessuna chiamata a focus()/scrollIntoView() collegata
   al cambio di valore, e touch-action:pan-x per non far scattare lo scroll
   verticale della pagina durante il drag orizzontale su mobile/tablet. */
const TIME_RANGES = ["1–5 anni", "5–10 anni", "10–15 anni", "Oltre 15 anni"];
function TimeSlider({idx, touched, onChange}){
  const shownIdx = idx == null ? 0 : idx;
  const pct = (shownIdx/3)*100;
  return (
    <div className="slider-wrap timeline-slider">
      <div className="time-track-wrap">
        <div className="time-track-line"/>

            <span key={label} className={"node-dot" + (touched && shownIdx===i ? " active" : "")}/>
          ))}
        </div>
        {touched && (
          <div className="time-thumb-ring" style={{left: pct + "%"}}/>

        <input
          type="range"
          min="0" max="3" step="1"
          value={shownIdx}

      </div>
      <div className="time-labels">
        {TIME_RANGES.map((label, i)=>(
          <span key={label} className={"time-label" + (touched && shownIdx===i ? " active" : "")}>{label}</span>
        ))}

  );
}

/* =========================================================================
   Import / Export — architettura estensibile e compatibile iOS/iPadOS
   ========================================================================= */

// Costruisce il payload JSON esportabile (usato sia dal download diretto
// sia dalla finestra "Salva con nome" via File System Access API).
const buildExportPayload = (fullAppState) => JSON.stringify({
  version: "1.0",
  timestamp: new Date().toISOString(),
  data: fullAppState
}, null, 2);

// Esporta l'INTERO albero di stato dell'app (schede attuali + future),
// avvolto in un contenitore con metadati. Usa URL.createObjectURL per
// bypassare i blocchi di sicurezza delle webview locali su iPad.
const exportProjectData = (fullAppState, filename = "strategia_generali_progetto.json") => {
  try {
    const jsonString = buildExportPayload(fullAppState);
    const blob = new Blob([jsonString], {type: "application/json;charset=utf-8;"});
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.setAttribute("download", filename);
    link.style.display = "none";

    document.body.appendChild(link);
    link.click();

    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }, 100);
    return true;
  } catch (error) {
    console.error("Errore durante l'esportazione:", error);
    alert("Impossibile esportare il file. Assicurati che l'applicazione supporti il salvataggio dei file.");
    return false;
  }
};

// Importa con merge intelligente: il file sovrascrive i dati esistenti ma
// mantiene i valori di default per eventuali schede future non presenti
// nei vecchi salvataggi.
const triggerImport = (setAppState, defaultInitialState, onDone) => {
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = ".json,application/json";
  fileInput.style.display = "none";

  fileInput.onchange = (event) => {
    const file = event.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsedFile = JSON.parse(e.target.result);
        const importedData = parsedFile.data || parsedFile;

        // Retrocompatibilità: i vecchi file avevano un solo progetto
        // (chiavi obiettivo/tempo/rischio dirette sulla radice) invece
        // dell'array "progetti". Li convertiamo al volo.
        let progettiImportati;
        if(Array.isArray(importedData.progetti) && importedData.progetti.length>0){
          progettiImportati = importedData.progetti.map((p, i) => ({
            id: p.id || ("progetto-" + (i+1)),
            nome: p.nome || ("Obiettivo " + (i+1)),
            obiettivo: {...DEFAULT_OBIETTIVO(), ...(p.obiettivo||{})},
            tempo: {...DEFAULT_TEMPO(), ...(p.tempo||{})},
            rischio: {...DEFAULT_RISCHIO(), ...(p.rischio||{})},
            importi: Array.isArray(p.importi) && p.importi.length>0 ? p.importi : [""]
          }));
        } else if(importedData.obiettivo || importedData.tempo || importedData.rischio){
          progettiImportati = [{
            id: "progetto-1",
            nome: "Obiettivo",
            obiettivo: {...DEFAULT_OBIETTIVO(), ...(importedData.obiettivo||{})},
            tempo: {...DEFAULT_TEMPO(), ...(importedData.tempo||{})},
            rischio: {...DEFAULT_RISCHIO(), ...(importedData.rischio||{})},
            importi: [""]
          }];
        } else {
          progettiImportati = defaultInitialState.progetti;
        }

        setAppState(prevState => ({
          ...defaultInitialState,
          ...importedData,
          progettiVita: typeof importedData.progettiVita === "string" ? importedData.progettiVita : defaultInitialState.progettiVita,
          progetti: progettiImportati,
          activeProgettoId: progettiImportati[0].id,
          cliente: {...defaultInitialState.cliente, ...(importedData.cliente||{})},
          familiari: Array.isArray(importedData.familiari) ? importedData.familiari : defaultInitialState.familiari
        }));

        if(onDone) onDone({type:"ok", text:"Progetto ripristinato con successo!"});
      } catch (err) {
        if(onDone) onDone({type:"error", text:"Errore nel caricamento: il file non è un file di progetto valido."});
      }
    };
    reader.readAsText(file);
  };

  document.body.appendChild(fileInput);
  fileInput.click();
  document.body.removeChild(fileInput);
};

/* ---------------- Tab Progetto (nome modificabile tramite icona matita —
   più affidabile del doppio clic su dispositivi touch come iPad) ---------------- */
function ProgettoTab({progetto, active, canDelete, onSelect, onRename, onDelete}){
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(progetto.nome);
  const inputRef = useRef(null);

  useEffect(()=>{ setDraft(progetto.nome); }, [progetto.nome]);
  useEffect(()=>{
    if(editing && inputRef.current){ inputRef.current.focus(); inputRef.current.select(); }
  }, [editing]);

  const commit = () => {
    setEditing(false);
    onRename(draft.trim() || progetto.nome || "Obiettivo");
  };

  const handleDelete = () => {
    if(!canDelete) return;
    const ok = window.confirm(`Eliminare la scheda "${progetto.nome}"? I dati inseriti andranno persi.`);
    if(ok) onDelete();
  };

  if(editing){
    return (
      <div className="progetto-tab-editing">
        <input
          ref={inputRef}
          className="progetto-tab-input"
          value={draft}
          onChange={(e)=>setDraft(e.target.value)}
          onBlur={commit}
          onKeyDown={(e)=>{
            if(e.key==="Enter"){ e.preventDefault(); commit(); }
            if(e.key==="Escape"){ setDraft(progetto.nome); setEditing(false); }
          }}
        />
        {canDelete && (
          <button
            type="button"
            className="progetto-tab-delete"
            onMouseDown={(e)=>e.preventDefault()}
            onClick={handleDelete}
            title="Elimina questa scheda progetto"
          >×</button>
        )}
      </div>
    );
  }

  return (
    <div
      className={"progetto-tab" + (active ? " active" : "")}
      onClick={onSelect}
      role="button"
      tabIndex={0}
    >
      <span className="progetto-tab-label">{progetto.nome}</span>
      <button
        type="button"
        className="progetto-tab-edit"
        onClick={(e)=>{ e.stopPropagation(); setEditing(true); }}
        title="Rinomina progetto"
      >
        <EditIcon/>
      </button>
    </div>
  );
}

/* ---------------- Main App ---------------- */
function App(){
  const [appState, setAppState] = useState(DEFAULT_APP_STATE);
  const {progettiVita, progetti, activeProgettoId, cliente, familiari} = appState;
  const activeProgetto = progetti.find(p => p.id === activeProgettoId) || progetti[0];
  const {obiettivo, tempo, rischio} = activeProgetto;

  // Ordina i progetti per priorità: risposta 3 della colonna Obiettivo
  // (importanzaObiettivo, scala 1-10). Punteggio più alto = priorità più alta.
  const progettiOrdinati = [...progetti].sort((a,b) => {
    const pa = a.obiettivo.importanzaObiettivo;
    const pb = b.obiettivo.importanzaObiettivo;
    return (pb==null ? -1 : pb) - (pa==null ? -1 : pa);
  });

  const updateProgettiVita = (v) => setAppState(prev => ({...prev, progettiVita: v}));

  const updateObiettivo = (patch) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===prev.activeProgettoId ? {...p, obiettivo:{...p.obiettivo, ...patch}} : p)
  }));
  const updateTempo = (patch) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===prev.activeProgettoId ? {...p, tempo:{...p.tempo, ...patch}} : p)
  }));
  const updateRischio = (patch) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===prev.activeProgettoId ? {...p, rischio:{...p.rischio, ...patch}} : p)
  }));
  const updateCliente = (patch) => setAppState(prev => ({...prev, cliente: {...prev.cliente, ...patch}}));

  // ---------------- Progetti (schede sovrapposte, come pagine Excel) ----------------
  const selectProgetto = (id) => setAppState(prev => ({...prev, activeProgettoId: id}));
  const renameProgetto = (id, nome) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===id ? {...p, nome} : p)
  }));
  const addProgetto = () => {
    const newId = "progetto-" + Date.now() + "-" + Math.floor(Math.random()*1000);
    setAppState(prev => ({
      ...prev,
      progetti: [...prev.progetti, {
        id: newId,
        nome: "Obiettivo " + (prev.progetti.length + 1),
        obiettivo: DEFAULT_OBIETTIVO(),
        tempo: DEFAULT_TEMPO(),
        rischio: DEFAULT_RISCHIO(),
        importi: [""]
      }],
      activeProgettoId: newId
    }));
  };
  const deleteProgetto = (id) => {
    setAppState(prev => {
      if(prev.progetti.length<=1) return prev; // mantieni sempre almeno una scheda
      const remaining = prev.progetti.filter(p => p.id!==id);
      const activeProgettoId = prev.activeProgettoId===id ? remaining[0].id : prev.activeProgettoId;
      return {...prev, progetti: remaining, activeProgettoId};
    });
  };

  // ---------------- Priorità: importi per progetto ----------------
  const addImporto = (progettoId) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===progettoId ? {...p, importi: [...(p.importi&&p.importi.length?p.importi:[""]), ""]} : p)
  }));
  const updateImporto = (progettoId, idx, value) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===progettoId ? {...p, importi: p.importi.map((v,i)=> i===idx ? value : v)} : p)
  }));
  const deleteImporto = (progettoId, idx) => setAppState(prev => ({
    ...prev,
    progetti: prev.progetti.map(p => p.id===progettoId ? {...p, importi: p.importi.filter((_,i)=>i!==idx)} : p)
  }));

  const addFamiliare = () => setAppState(prev => ({
    ...prev,
    familiari: [...prev.familiari, {id: Date.now()+Math.random(), parentela:"", nome:"", cognome:"", dataNascita:"", codiceFiscale:"", residenza:""}]
  }));
  const updateFamiliare = (id, field, value) => setAppState(prev => ({
    ...prev,
    familiari: prev.familiari.map(f => f.id===id ? {...f, [field]: value} : f)
  }));
  const removeFamiliare = (id) => setAppState(prev => ({
    ...prev,
    familiari: prev.familiari.filter(f => f.id!==id)
  }));

  // ANAGRAFICA CLIENTE — modale
  const [clienteModalOpen, setClienteModalOpen] = useState(false);

  // ---------------- Import / Export / Print ----------------
  const [importMsg, setImportMsg] = useState(null);

  // Nome file suggerito in fase di esportazione: "Strategia Generali per [Cliente]"
  const buildSuggestedFilename = () => {
    const nomeCompleto = [cliente?.nome, cliente?.cognome].filter(Boolean).join(" ").trim();
    const base = nomeCompleto ? `Strategia Generali per ${nomeCompleto}` : "Strategia Generali per";
    return `${base}.json`;
  };

  const handleExport = async () => {
    const suggestedName = buildSuggestedFilename();
    const jsonString = buildExportPayload(appState);

    // 1) Chrome (desktop/Android) e altri browser con File System Access API:
    // apre la vera finestra di sistema "Salva con nome".
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName,
          types: [{ description: "File JSON", accept: {"application/json": [".json"]} }]
        });
        const writable = await handle.createWritable();
        await writable.write(jsonString);
        await writable.close();
        setImportMsg({type:"ok", text:"Esportazione completata."});
      } catch (err) {
        if (err && err.name !== "AbortError") {
          console.error("Errore durante l'esportazione:", err);
          setImportMsg({type:"err", text:"Impossibile esportare il file."});
        }
      }
      return;
    }

    // 2) iPad/iPhone (Safari) e altri browser con Web Share API: apre il foglio di
    // condivisione di sistema, dove "Salva in File" permette di scegliere la
    // cartella (e in genere anche di modificare il nome prima di salvare).
    try {
      const file = new File([jsonString], suggestedName, {type: "application/json"});
      if (navigator.canShare && navigator.canShare({files:[file]})) {
        await navigator.share({files:[file], title: suggestedName});
        setImportMsg({type:"ok", text:"Esportazione completata."});
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return; // utente ha annullato la condivisione
      console.error("Errore durante la condivisione:", err);
      // in caso di altro errore, prosegue con il fallback finale sotto
    }

    // 3) Fallback finale per browser privi delle API sopra: download diretto
    // col nome suggerito.
    const ok = exportProjectData(appState, suggestedName);
    if(ok) setImportMsg({type:"ok", text:"Esportazione completata."});
  };

  const handleImportClick = () => {
    triggerImport(setAppState, DEFAULT_APP_STATE, (msg) => setImportMsg(msg));
  };

  const handlePrint = () => { window.print(); };

  const obiettivoSummary = () => {
    const {capitaleNecessario, risultato, importanzaObiettivo} = obiettivo;
    if(!capitaleNecessario && !risultato && importanzaObiettivo==null) return "Definiamo insieme i tuoi obiettivi e le tue priorità.";
    const parts = [];
    if(capitaleNecessario) parts.push(`Capitale: ${capitaleNecessario.length>24 ? capitaleNecessario.slice(0,24)+"…" : capitaleNecessario}`);
    if(risultato) parts.push(`Risultato: ${risultato.length>24 ? risultato.slice(0,24)+"…" : risultato}`);
    if(importanzaObiettivo!=null) parts.push(`Priorità: ${importanzaObiettivo}/10`);
    return parts.join(" · ");
  };

  const tempoSummary = () => {
    const {orizzonteIdx, orizzonteTouched, accessoImprevisto} = tempo;
    if(!orizzonteTouched && !accessoImprevisto) return "Valutiamo insieme il tuo orizzonte temporale e le tue esigenze di liquidità.";
    const parts = [];
    if(orizzonteTouched) parts.push(`Orizzonte: ${TIME_RANGES[orizzonteIdx]}`);
    if(accessoImprevisto) parts.push(`Accesso al capitale: ${accessoImprevisto}`);
    return parts.length ? parts.join(" · ") : "Valutiamo insieme il tuo orizzonte temporale e le tue esigenze di liquidità.";
  };

  const rischioSummary = () => {
    const {quotaPatrimonio, quotaReddito, azioneCalo} = rischio;
    if(!quotaPatrimonio && !quotaReddito && !azioneCalo) return "Comprendiamo insieme la tua capacità di investimento.";
    const parts = [];
    if(quotaPatrimonio) parts.push(`Quota patrimonio: ${quotaPatrimonio}`);
    if(quotaReddito) parts.push(`Quota reddito: ${quotaReddito}`);
    if(azioneCalo) parts.push(`In caso di calo: ${azioneCalo}`);
    return parts.length ? parts.join(" · ") : "Comprendiamo insieme la tua capacità di investimento.";
  };

  const ArrowSvg = () => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M9 5l7 7-7 7"/>
    </svg>
  );

  return (
    <div className="app">

      <header className="hero">
        <div className="hero-text">
          <h1>La nostra strategia, <span className="accent">costruita su di te</span></h1>
          <p className="sub">Rispondi alle domande per aiutarci a comprendere le tue esigenze e costruire insieme la <strong>soluzione più adatta</strong> ai tuoi obiettivi.</p>
        </div>
        <button className="cliente-badge no-print" onClick={()=>setClienteModalOpen(true)}>
          <PersonIcon/> Cliente
        </button>
      </header>

      <div className="life-banner">
        <p className="lb-question">Quali sono i TUOI OBIETTIVI di vita che meritano di essere finanziati oggi?</p>
        <textarea
          value={progettiVita}
          onChange={(e)=>updateProgettiVita(e.target.value)}
          placeholder="Scrivi qui la risposta..."
          rows={2}
        />
      </div>

      <div className="progetti-row no-print">
        {progetti.map(p => (
          <ProgettoTab
            key={p.id}
            progetto={p}
            active={p.id===activeProgettoId}
            canDelete={progetti.length>1}
            onSelect={()=>selectProgetto(p.id)}
            onRename={(nome)=>renameProgetto(p.id, nome)}
            onDelete={()=>deleteProgetto(p.id)}
          />
        ))}
        <button type="button" className="cliente-badge progetto-add-btn" onClick={addProgetto} title="Aggiungi nuovo progetto">+</button>
      </div>

      <div className="columns-row no-print">

        {/* ---------------- OBIETTIVO ---------------- */}
        <div className="card">
          <div className="circle">1</div>
          <div className="card-header red">
            <h2>OBIETTIVO</h2>
          </div>
          <div className="card-body">
            <Question icon={<CoinIcon/>} number="1" text="Quanto capitale immagini possa servire per realizzare il tuo obiettivo?">
              <LineInput
                value={obiettivo.capitaleNecessario}
                onChange={(v)=>updateObiettivo({capitaleNecessario:v})}
                autoFocus
              />
            </Question>

            <Question icon={<TrophyIcon/>} number="2" text="Quale risultato si auspica di ottenere per considerare questo incontro un successo?">
              <LineInput value={obiettivo.risultato} onChange={(v)=>updateObiettivo({risultato:v})}/>
            </Question>

            <Question icon={<StarIcon/>} number="3" text="Quanto è importante raggiungere questo obiettivo per te?">
              <ScaleQuestion value={obiettivo.importanzaObiettivo} onChange={(v)=>updateObiettivo({importanzaObiettivo:v})}/>
            </Question>

            <div style={{flex:1}}/>
            <PromiseBox icon={<PersonIcon/>} text={obiettivoSummary()}/>
          </div>
        </div>

        <div className="arrow-wrap"><ArrowSvg/></div>

        {/* ---------------- TEMPO ---------------- */}
        <div className="card dark">
          <div className="circle">2</div>
          <div className="card-header dark">
            <h2>TEMPO</h2>
          </div>
          <div className="card-body">
            <Question icon={<HourglassIcon/>} number="1" text="Tra quanti anni vorresti vedere il tuo progetto realizzarsi?">
              <TimeSlider
                idx={tempo.orizzonteIdx}
                touched={tempo.orizzonteTouched}
                onChange={(v)=>updateTempo({orizzonteIdx:v, orizzonteTouched:true})}
              />
            </Question>
            <Question icon={<WalletIcon/>} number="2" text="Se si verificasse un imprevisto personale, quanto sarebbe importante poter accedere al capitale investito?">
              <ChoiceQuestion
                options={["Importante, per ogni imprevisto","Necessario, solo in caso di Salute","Trascurabile, ho un cuscinetto separato"]}
                value={tempo.accessoImprevisto}
                onChange={(v)=>updateTempo({accessoImprevisto:v})}
              />
            </Question>
            <Question icon={<PieIcon/>} number="3" text="Ci sono stati episodi in passato che hanno influenzato la gestione dei tuoi investimenti?">
              <LineInput value={tempo.esperienze} onChange={(v)=>updateTempo({esperienze:v})}/>
            </Question>
            <div style={{flex:1}}/>
            <PromiseBox icon={<CalendarIcon/>} text={tempoSummary()}/>
          </div>
        </div>

        <div className="arrow-wrap"><ArrowSvg/></div>

        {/* ---------------- RISCHIO ---------------- */}
        <div className="card">
          <div className="circle">3</div>
          <div className="card-header red">
            <h2>CAPACITÀ</h2>
          </div>
          <div className="card-body">
            <Question icon={<PieIcon/>} number="1" text="Quanto rappresenta questo investimento sul totale del tuo patrimonio?">
              <ChoiceQuestion
                options={["Meno del 25%","Tra il 25% e il 50%","Tra il 50% e il 75%","Oltre il 75%"]}
                value={rischio.quotaPatrimonio}
                onChange={(v)=>updateRischio({quotaPatrimonio:v})}
              />
            </Question>
            <Question icon={<WalletIcon/>} number="2" text="Rispetto al tuo reddito mensile, quanto potresti destinare a questo progetto?">
              <ChoiceQuestion
                options={["Meno del 10%","Tra il 10% e il 25%","Oltre il 25%"]}
                value={rischio.quotaReddito}
                onChange={(v)=>updateRischio({quotaReddito:v})}
              />
            </Question>
            <Question icon={<ShieldPctIcon/>} number="3" text="Se il mercato scendesse temporaneamente del 10% cosa faresti?">
              <ChoiceQuestion
                options={["Riscatto l'intero importo","Provo a non pensarci sperando che il mercato risalga","Attendo con serenità","Approfitto del momento con un nuovo versamento"]}
                value={rischio.azioneCalo}
                onChange={(v)=>updateRischio({azioneCalo:v})}
              />
            </Question>
            <div style={{flex:1}}/>
            <PromiseBox icon={<ShieldHeartIcon/>} text={rischioSummary()}/>
          </div>
        </div>

      </div>

      <div className="print-only print-schede">
        {progetti.map(p => (
          <div className="print-progetto" key={p.id}>
            <h2 className="print-progetto-title">{p.nome}</h2>
            <table className="print-table">
              <tbody>
                <tr className="print-section-row"><td colSpan="2">OBIETTIVO</td></tr>
                <tr>
                  <td>1. Quanto capitale immagini possa servire per realizzare il tuo obiettivo?</td>
                  <td>{p.obiettivo.capitaleNecessario || "—"}</td>
                </tr>
                <tr>
                  <td>2. Quale risultato si auspica di ottenere per considerare questo incontro un successo?</td>
                  <td>{p.obiettivo.risultato || "—"}</td>
                </tr>
                <tr>
                  <td>3. Quanto è importante raggiungere questo obiettivo per te?</td>
                  <td>{p.obiettivo.importanzaObiettivo!=null ? `${p.obiettivo.importanzaObiettivo}/10` : "—"}</td>
                </tr>

                <tr className="print-section-row"><td colSpan="2">TEMPO</td></tr>
                <tr>
                  <td>1. Tra quanti anni vorresti vedere il tuo progetto realizzarsi?</td>
                  <td>{p.tempo.orizzonteTouched ? TIME_RANGES[p.tempo.orizzonteIdx] : "—"}</td>
                </tr>
                <tr>
                  <td>2. Se si verificasse un imprevisto personale, quanto sarebbe importante poter accedere al capitale investito?</td>
                  <td>{p.tempo.accessoImprevisto || "—"}</td>
                </tr>
                <tr>
                  <td>3. Ci sono stati episodi in passato che hanno influenzato la gestione dei tuoi investimenti?</td>
                  <td>{p.tempo.esperienze || "—"}</td>
                </tr>

                <tr className="print-section-row"><td colSpan="2">CAPACITÀ</td></tr>
                <tr>
                  <td>1. Quanto rappresenta questo investimento sul totale del tuo patrimonio?</td>
                  <td>{p.rischio.quotaPatrimonio || "—"}</td>
                </tr>
                <tr>
                  <td>2. Rispetto al tuo reddito mensile, quanto potresti destinare a questo progetto?</td>
                  <td>{p.rischio.quotaReddito || "—"}</td>
                </tr>
                <tr>
                  <td>3. Se il mercato scendesse temporaneamente del 10% cosa faresti?</td>
                  <td>{p.rischio.azioneCalo || "—"}</td>
                </tr>
              </tbody>
            </table>
          </div>
        ))}
      </div>

      <div className="priority-banner">
        <div className="pb-header">
          <div className="pb-side pb-side-ghost"></div>
          <div className="pb-header-text">
            <p className="pb-title">Progetto Strategia Generali</p>
            <p className="pb-subtitle">Quanto è disposto a destinare oggi a questo progetto?</p>
          </div>
        </div>
        <div className="pb-body">
          <div className="pb-side"><span>Priorità</span></div>
          <div className="pb-content">
            <div className="priority-list">
              {progettiOrdinati.map(p => (
                <div className="priority-row" key={p.id}>
                  <span className="priority-badge">{p.nome}</span>
                  {(p.importi && p.importi.length ? p.importi : [""]).map((val, idx) => (
                    <div className="priority-importo-wrap" key={idx}>
                      <input
                        type="text"
                        className="priority-importo-input"
                        placeholder="Importo"
                        value={val}
                        onChange={(e)=>updateImporto(p.id, idx, e.target.value)}
                      />
                      <button
                        type="button"
                        className="priority-importo-x no-print"
                        onClick={()=>deleteImporto(p.id, idx)}
                        title="Rimuovi questo importo"
                      >×</button>
                    </div>
                  ))}
                  <button
                    type="button"
                    className="priority-add-importo no-print"
                    onClick={()=>addImporto(p.id)}
                    title="Aggiungi un altro importo"
                  >+</button>
                </div>
              ))}
            </div>
          </div>
          <div className="pb-tagline"><p>&ldquo;Diamo VALORE ai tuo OBIETTIVI.&rdquo;</p></div>
        </div>
      </div>

      <div className="promise-bar">
        <div className="promise-item">
          <div className="pi-icon"><PersonIcon/></div>
          <div>
            <h3>LA NOSTRA PROMESSA</h3>
            <p>Ti affianchiamo con competenza, trasparenza e ascolto per aiutarti a prendere decisioni consapevoli.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><PeopleIcon/></div>
          <div>
            <h3>ASCOLTO</h3>
            <p>Capiamo le tue esigenze per conoscerti veramente.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><SearchIcon/></div>
          <div>
            <h3>ANALISI</h3>
            <p>Valutiamo insieme tutte le variabili che contano.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><CompassIcon/></div>
          <div>
            <h3>PIANIFICAZIONE</h3>
            <p>Costruiamo un piano su misura per i tuoi obiettivi.</p>
          </div>
        </div>
        <div className="promise-item">
          <div className="pi-icon"><ChartUpIcon/></div>
          <div>
            <h3>MONITORAGGIO</h3>
            <p>Ti accompagniamo nel tempo, adattando la strategia con te.</p>
          </div>
        </div>

        <div className="quote">
          <span className="mark">&ldquo;</span>
          <span>Il miglior investimento è quello che ti porta verso il <strong>futuro che desideri</strong>.</span>
          <span className="mark">&rdquo;</span>
        </div>
      </div>

      <div className="toolbar no-print">
        <button className="tb-btn" onClick={handlePrint}><PrintIcon/> Stampa / Export PDF</button>
        <button className="tb-btn" onClick={handleImportClick}><UploadIcon/> Importa Progetto</button>
        <button className="tb-btn primary" onClick={handleExport}><DownloadIcon/> Esporta Progetto</button>
      </div>
      {importMsg && <p className={"import-msg no-print " + importMsg.type}>{importMsg.text}</p>}

      <ClienteModal
        open={clienteModalOpen}
        onClose={()=>setClienteModalOpen(false)}
        cliente={cliente}
        updateCliente={updateCliente}
        familiari={familiari}
        addFamiliare={addFamiliare}
        updateFamiliare={updateFamiliare}
        removeFamiliare={removeFamiliare}
      />

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
